<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Kura Promo Video</title>
<!--
  Kura（Android）の紹介動画。1920x1080 の1枚の絵を、時刻 time（秒）だけで決まる render(time) で描く。
  record-promo.mjs が 1/30 秒ずつ render を呼んでは撮り（端末ピクセル比 2 で 3840x2160）、promo-audio.py で合成した音を付けて images/promo/promo-<lang>.mp4 にする。
  音楽は 120 BPM・2 秒で 1 小節。場面は小節の頭で始まり、動きは拍に乗る。SCENES や DRAW の時刻を変えたら promo-audio.py の効果音も合わせる。
  ブラウザで開くとそのまま再生する（?t=12 でその時刻に止める）。?lang=xx: en ja zh zh-TW ko es fr de pt it ru id hi tr vi th pl ar nl bn（en が既定）。入りきらない見出しは縮める。
  画面パーツはストア画像と同じ store-art.js / store-art.css、見出しは store-images-i18n.js、動画だけの言葉は promo-i18n.js。
  ストア画像と同じ順の9場面: 紹介（写真の壁・ロゴ・オールインワンの一言・5つの札）／片付け（残すで右へ・ブレた写真を捨てるで左へ・見つかった容量が数え上がる）／
  AI 加工（加工前から加工後へ拭き取る・ほかの種類）／ボディと料理（ふっくら・加工前・スリムの3枚、料理の拭き取り）／
  Google フォトから移行（写真が Kura へ飛ぶ・移るもの3種類）／バックアップ（進み具合・クラウドだけの動画）／
  探す（地名を打つと結果・地図のピン）／プライベート（暗い地・画面ロックで開く）／締め（ロゴ・Google Play）。
  加工の絵はストア画像と同じ、アプリの実際の処理の結果（images/photos/CREDITS.txt）。
  料金は載せない。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<link rel="stylesheet" href="store-art.css">
<style>
html, body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
#film { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--primary); color:#fff; font-family:var(--ui); }
#film .dark { position:absolute; inset:0; opacity:0; background:radial-gradient(80% 90% at 60% 55%, #1E3B2C 0, #111613 60%, #0B0D0C 100%); }
.scene { position:absolute; inset:0; display:none; }
.cap2 { position:absolute; left:130px; top:0; bottom:0; width:670px; display:flex; flex-direction:column; justify-content:center; gap:30px; }
.cap2 h1 { font-size:78px; line-height:1.08; font-weight:800; letter-spacing:-.025em; text-wrap:balance; }
.cap2 p { font-size:34px; line-height:1.36; font-weight:500; color:#CDEBD7; text-wrap:pretty; }
#sPriv .cap2 p { color:#A9C3B3; }
body.cjk .cap2 h1, body.cjk .cap2 p, body.cjk .brand2 small { word-break:keep-all; }
body.cjk .cap2 h1 { letter-spacing:-.01em; line-height:1.2; }
/* One long phrase would otherwise never wrap, and shrink to nothing. */
body.cjk #sMove .cap2 h1, body.cjk #sPriv .cap2 h1, body.cjk #sPriv .cap2 p { word-break:normal; }
body.rtl .cap2, body.rtl .brand2 { direction:rtl; }

/* the phone: 400 x 866 dp at 1.05 */
.vdev { position:absolute; left:860px; top:61px; padding:12px; border-radius:58px; background:#111210;
  box-shadow:0 40px 90px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.06); }
.vdev .glass { border-radius:46px; }
#sPriv .vdev { box-shadow:0 40px 110px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.08), 0 0 160px rgba(143,203,166,.16); }
/* a piece laid beside the phone; its zoom sits inside so left/top stay in canvas pixels */
.pw { position:absolute; z-index:5; }
.pw .callout { position:relative; left:auto; top:auto; }

/* 1 and 7: the wall and the name */
.wall2 { position:absolute; left:760px; top:-300px; width:1600px; display:flex; gap:26px; transform-origin:50% 0; }
.wall2 .col { flex:1; display:flex; flex-direction:column; gap:26px; }
.wall2 img { width:100%; border-radius:32px; object-fit:cover; display:block; }
.fade2 { position:absolute; inset:0; background:linear-gradient(90deg, var(--primary) 0, var(--primary) 38%, rgba(35,107,70,.6) 52%,
  rgba(35,107,70,.1) 70%, rgba(35,107,70,0) 100%); }
.brand2 { position:absolute; left:140px; top:0; bottom:0; width:900px; display:flex; flex-direction:column; justify-content:center; gap:36px; }
.brand2 .row { display:flex; align-items:center; gap:38px; direction:ltr; transform-origin:0 50%; }
.brand2 svg { width:170px; height:170px; border-radius:44px; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 24px 60px rgba(0,0,0,.25); }
.brand2 b { font-size:176px; line-height:1; font-weight:800; letter-spacing:-5px; }
.brand2 small { font-size:54px; line-height:1.2; font-weight:600; text-wrap:balance; }
.brand2 .tags { display:flex; flex-wrap:wrap; gap:16px; max-width:820px; }
.brand2 .tag { transform-origin:30% 50%; }
#sCta .wall2 { opacity:.22; }
#sCta .fade2 { background:radial-gradient(70% 90% at 30% 50%, var(--primary) 0, rgba(35,107,70,.75) 60%, rgba(35,107,70,.4) 100%); }
.ctabtn { display:inline-flex; align-items:center; gap:16px; align-self:flex-start; height:92px; padding:0 44px 0 34px; border-radius:46px;
  background:#fff; color:var(--primary); font-size:36px; font-weight:700; box-shadow:0 24px 50px rgba(0,0,0,.25); }
.ctabtn i { font-size:46px; }

/* 3: the photos the swipe sends away, drawn over the phone so they can leave it */
.fly2 { position:absolute; z-index:6; }
.fc { position:absolute; inset:0; border-radius:25px; overflow:hidden; background:#000; box-shadow:0 18px 44px rgba(0,0,0,.32); }
.fc img { width:100%; height:100%; object-fit:cover; display:block; }
.fc .seal { zoom:1.3; opacity:0; }

/* 4: Private, locked until the screen lock opens it */
.lockov { position:absolute; left:0; right:0; top:34px; bottom:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; background:rgba(246,245,241,.72); backdrop-filter:blur(22px); color:var(--on); font-family:var(--ui); }
.lockov .mo { font-size:64px; color:var(--primary); }
.lockov b { font-size:26px; font-weight:600; }
.lockov .qc { zoom:1.4; }
.fp { position:relative; width:110px; height:110px; margin-top:36px; border-radius:50%; background:var(--primaryC); color:var(--onPrimaryC);
  display:flex; align-items:center; justify-content:center; }
.fp i { font-size:64px; }
.fp span { position:absolute; inset:0; border-radius:50%; border:3px solid var(--primary); opacity:0; }

/* 3 and 4: a before wiped into its after */
.wipe { position:absolute; border-radius:36px; overflow:hidden; background:#222; box-shadow:0 30px 70px rgba(0,0,0,.45); }
.wipe img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.wipe .bar { position:absolute; top:0; bottom:0; width:6px; margin-left:-3px; background:#fff; box-shadow:0 0 16px rgba(0,0,0,.55); }
.wipe b { position:absolute; top:22px; padding:10px 26px; border-radius:30px; font:700 34px/1.2 var(--ui); white-space:nowrap; }
.wipe .l1 { left:22px; background:rgba(0,0,0,.62); color:#fff; }
.wipe .l2 { right:22px; background:#fff; color:#1B1B19; box-shadow:0 2px 12px rgba(0,0,0,.45); }
.minis { position:absolute; left:1470px; top:150px; width:280px; display:grid; grid-template-rows:repeat(3,250px); gap:15px; }
.minis figure, .trio2 figure, .kinds2 figure { margin:0; position:relative; overflow:hidden; background:#222; }
.minis figure { border-radius:28px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
.minis img, .trio2 img, .kinds2 img { display:block; width:100%; height:100%; object-fit:cover; }
.minis em, .kinds2 em { position:absolute; left:0; right:0; bottom:0; padding:46px 12px 14px; text-align:center; color:#fff; font:600 28px/1.2 var(--ui);
  background:linear-gradient(transparent,rgba(0,0,0,.76)); }

/* 4: the body's three results, then the food */
.stage2 { position:absolute; left:860px; top:130px; width:1000px; }
.stage2 h2 { position:absolute; left:0; right:0; top:0; margin:0; text-align:center; color:#fff; font:600 40px/56px var(--ui); }
.trio2 { position:absolute; left:0; right:0; top:70px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; height:690px; direction:ltr; }
.trio2 figure { border-radius:30px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
.trio2 b { position:absolute; left:50%; top:16px; transform:translateX(-50%); padding:8px 22px; border-radius:26px; background:rgba(0,0,0,.62); color:#fff;
  font:700 32px/1.2 var(--ui); white-space:nowrap; }
.trio2 figure:nth-child(2) b { background:#fff; color:#1B1B19; box-shadow:0 2px 12px rgba(0,0,0,.45); }
.trio2 .line { position:absolute; left:-10px; right:-10px; top:434px; border-top:5px dashed rgba(255,255,255,.95); filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); transform-origin:0 50%; }

/* 5: photos leaving for Kura, and what comes over */
.flow2 { position:absolute; left:870px; top:70px; width:960px; height:400px; }
.mos { position:absolute; top:0; width:430px; height:290px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:1fr 1fr; gap:6px; border-radius:30px; overflow:hidden; }
.mos img, .thumb { display:block; width:100%; height:100%; object-fit:cover; }
.thumb { position:absolute; width:139px; height:142px; border-radius:18px; z-index:3; box-shadow:0 14px 30px rgba(0,0,0,.3); }
.kicon { position:absolute; top:15px; width:260px; height:260px; }
.kicon svg { width:100%; height:100%; }
.flow2 .go { position:absolute; top:101px; width:88px; height:88px; border-radius:50%; background:#fff; color:#236B46; font-size:54px; line-height:88px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); }
.flow2 span { position:absolute; top:304px; text-align:center; color:#fff; font:600 38px/1.2 var(--ui); }
.kinds2 { position:absolute; left:870px; top:440px; width:960px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; height:560px; }
.kinds2 figure { border-radius:30px; box-shadow:0 24px 60px rgba(0,0,0,.3); }
.kinds2 i { position:absolute; inset-inline-start:16px; top:16px; width:68px; height:68px; border-radius:50%; background:#fff; color:#236B46; font-size:40px; line-height:68px; text-align:center; }
.kinds2 em { font-size:32px; }
body.rtl .kinds2 { direction:rtl; }
</style>
</head>
<body>
<div id="film"><div class="dark"></div></div>
<script src="store-images-app-strings.js"></script>
<script src="store-images-i18n.js"></script>
<script src="promo-i18n.js"></script>
<script src="store-art.js"></script>
<script>
const PC = window.PROMO_I18N[L] || window.PROMO_I18N.en;
const PH = { w:400, h:866, cols:4, zoom:1.05 };
const DUR = 44, FPS = 30, XF = .5;
// [id, start, end] in seconds; neighbours cross-fade over XF around the cut.
const SCENES = [['sIntro', 0, 4], ['sClean', 4, 10], ['sEdit', 10, 16], ['sBody', 16, 22], ['sMove', 22, 28], ['sBack', 28, 32], ['sFind', 32, 36], ['sPriv', 36, 40], ['sCta', 40, DUR]];
const DARK = new Set(['sEdit', 'sBody', 'sPriv']);

// ─────────────── time ───────────────
const pr = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const put = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };
// Comes in: fades up and rises dy px, starting at `at` seconds into the scene.
const rise = (el, u, at, dy = 40) => { const k = eo(pr(u, at, at + .7)); put(el, k, `translateY(${(1 - k) * dy}px)`); };
// Pops in from small, a little past full size and back.
const pop = (el, u, at, extra = '', from = .6) => { const k = back(pr(u, at, at + .5)); put(el, pr(u, at, at + .2), `${extra} scale(${from + (1 - from) * k})`); };

// ─────────────── the scenes ───────────────
const phone = name => `<div class="vdev">${screen(name, PH)}</div>`;
const cap = (h, p) => `<div class="cap2"><h1>${h}</h1><p>${p}</p></div>`;
const piece = (st, inner) => `<div class="pw" style="${st}">${inner}</div>`;
const WALL = [['p360', 'p164', 'p509', 'p292', 'p77', 'p431'], ['p200', 'p516', 'p553', 'p437', 'p13', 'p49'], ['p429', 'p392', 'p106', 'p565', 'p288', 'p419'],
  ['p525', 'p152', 'p433', 'p450', 'p219', 'p124'], ['p507', 'p488', 'p110', 'p237', 'p434', 'p163']];
const HEIGHTS = [300, 380, 300, 340, 300, 360];
const wall = () => `<div class="wall2">${WALL.map((col, c) => `<div class="col" style="margin-top:${[120, 0, 200, 60, 160][c]}px">
  ${col.map((src, i) => `<img src="${P(src)}" style="height:${HEIGHTS[(i + c) % HEIGHTS.length]}px">`).join('')}</div>`).join('')}</div><div class="fade2"></div>`;
const TAGS = `<span class="tag">${mi('photo_library')}${C.f1t}</span><span class="tag">${mi('cleaning_services')}${C.f2t}</span>
  <span class="tag">${mi('auto_fix_high')}${C.f5t}</span><span class="tag">${mi('lock')}${fill(C.f3t)}</span><span class="tag">${mi('cloud_done')}${fill(C.f4t)}</span>`;
const brand = extra => `<div class="brand2"><div class="row">${ICON_SVG('16 16 76 76')}<b>${t('app_name')}</b></div>
  <small>${C.one}</small><div class="tags">${TAGS}</div>${extra}</div>`;
const FOUND = [['content_copy', t('session_dup'), 1.9, 'primary'], ['burst_mode', t('session_similar'), 5.7, 'primary'],
  ['blur_on', t('session_blurry'), .61, 'tertiary'], ['sd_card', t('session_large'), 6.4, 'tertiary']];

// A before and its after in one frame, wiped across.
const wipe = (id, a, b, st) => `<div class="wipe" id="${id}" style="${st}"><img src="${P(a)}"><img class="aft" src="${P(b)}"><i class="bar"></i><b class="l1">${C.b7}</b><b class="l2">${C.a7}</b></div>`;
const wiped = (el, k) => {
  $('.aft', el).style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`;
  const bar = $('.bar', el);
  bar.style.left = `${(1 - k) * 100}%`;
  bar.style.opacity = Math.min(1, Math.sin(Math.PI * k) * 6);
  $('.l1', el).style.opacity = 1 - pr(k, .55, .8);
  $('.l2', el).style.opacity = pr(k, .2, .45);
};
const STYLES = [['edit-makeup', t('editor_ai_makeup')], ['edit-bob', t('editor_ai_hair_bob')], ['edit-glasses', t('editor_tool_ai_request')]];
const BODIES = [['body-fuller', t('editor_body_look_fuller')], ['body-before', C.b7], ['body-after', t('editor_body_look_leaner')]];
const FROM = ['p199', 'p436', 'p77', 'p434', 'p124', 'p401'];
const KINDS = [['p436', 'photo_album', t('tab_albums')], ['p215', 'favorite', t('lib_favorites')], ['p381', 'add_photo_alternate', C.m6]];
const RTL = L === 'ar';
const MOS_X = RTL ? 530 : 0, ICON_X = RTL ? 60 : 640, ARROW_X = 436;
const CELL = i => ({ x:MOS_X + (i % 3) * 145.3, y:Math.floor(i / 3) * 148 });

const film = $('#film');
film.insertAdjacentHTML('beforeend', `
<div class="scene" id="sIntro">${wall()}${brand('')}</div>
<div class="scene" id="sClean">${cap(C.h2, C.s2)}${phone('swipe')}
  <div class="finds" style="left:1380px;right:auto;top:230px;width:400px">${FOUND.map(([icon, name, gb, tone]) => `<div class="find">
    <span class="dsc" style="background:var(--${tone}C);color:var(--on${tone[0].toUpperCase() + tone.slice(1)}C)">${mi(icon, 'mo')}</span>
    <div><b>${name}</b><em data-gb="${gb}">${bytes(gb)}</em></div></div>`).join('')}</div>
</div>
<div class="scene" id="sEdit">${cap(C.h7, C.s7)}${wipe('wEdit', 'edit-before', 'edit-smolder', 'left:900px;top:150px;width:520px;height:780px')}
  <div class="minis">${STYLES.map(([src, name]) => `<figure><img src="${P(src)}"><em>${name}</em></figure>`).join('')}</div>
</div>
<div class="scene" id="sBody">${cap(C.h8, C.s8)}
  <div class="stage2" id="bodyStage"><h2>${t('editor_body')}</h2><div class="trio2">
    ${BODIES.map(([src, name]) => `<figure><img src="${P(src)}"><b>${name}</b></figure>`).join('')}<div class="line"></div></div></div>
  <div class="stage2" id="foodStage"><h2>${t('editor_filter_food')} · ${t('editor_look_sizzle')}</h2>
    ${wipe('wFood', 'food-before', 'food-after', 'left:240px;top:70px;width:520px;height:727px')}</div>
</div>
<div class="scene" id="sMove">${cap(t('intro_move_title').replace(/Google /g, 'Google\u00a0'), t('import_row_hint'))}
  <div class="flow2"><div class="mos" style="left:${MOS_X}px">${FROM.map(src => `<img src="${P(src)}">`).join('')}</div>
    ${mi('arrow_forward', 'mi go', `left:${ARROW_X}px;${RTL ? 'transform:rotate(180deg)' : ''}`)}
    <div class="kicon" style="left:${ICON_X}px">${ICON_SVG('16 16 76 76')}</div>
    <span style="left:${MOS_X}px;width:430px">${C.gp}</span><span style="left:${ICON_X}px;width:260px">${t('app_name')}</span>
    ${FROM.map(src => `<img class="thumb" src="${P(src)}">`).join('')}</div>
  <div class="kinds2">${KINDS.map(([src, icon, name]) => `<figure><img src="${P(src)}">${mi(icon, 'mo')}<em>${name}</em></figure>`).join('')}</div>
</div>
<div class="scene" id="sBack">${cap(C.h5, C.s5)}${phone('cloud')}
  ${piece('left:1390px;top:250px', `<div class="callout" style="zoom:1.35">${videoCallout()}</div>`)}
</div>
<div class="scene" id="sFind">${cap(C.h4, C.s4)}${phone('collections')}
  ${piece('left:1350px;top:150px', `<div class="callout" style="zoom:1.3">${searchCallout()}</div>`)}
  ${piece('left:1390px;top:610px', `<div class="callout" style="zoom:1.2">${mapCallout()}</div>`)}
</div>
<div class="scene" id="sPriv">${cap(t('intro_private_title'), t('intro_private_text', t('lib_vault')))}${phone('vault')}</div>
<div class="scene" id="sCta">${wall()}${brand(`<div class="ctabtn">${mi('shop')}${PC.cta}</div>`)}</div>`);

// The swipe deck is drawn again over the phone: the kept photo, the blurry one, and the next.
{
  const dev = $('#sClean .vdev');
  dev.insertAdjacentHTML('beforeend', `<div class="fly2">
    <div class="fc" id="fcC"><img src="${P('p509')}"></div>
    <div class="fc" id="fcB"><img src="${P('p553')}" style="filter:blur(3px);transform:scale(1.08)">${seal(t('swipe_trash'), '#B3261E', 'right', 9)}</div>
    <div class="fc" id="fcA"><img src="${P('p1025')}" style="object-position:50% 40%">${seal(t('swipe_keep'), '#236B46', 'left', -9)}</div></div>`);
  $$('#sClean .deck .mcard').forEach(el => el.style.visibility = 'hidden');
}
// Private starts locked: the screen lock's sheet over it, then the fingerprint.
$('#sPriv .glass').insertAdjacentHTML('beforeend', `<div class="lockov">${mi('lock', 'mo')}<b>${t('vault_locked')}</b>
  <span class="qc">${t('vault_unlock')}</span><div class="fp"><span></span><span></span>${mi('fingerprint')}</div></div>`);

// ─────────────── what each scene does at u seconds into it ───────────────
const QUERY = Array.from(C.cities[1]);
const RUN = { from:412, to:1150, of:1204 };
const DRAW = {
  sIntro(u, s) {
    put($('.wall2', s), pr(u, 0, .9), `rotate(-11deg) translateY(${-u * 26}px)`);
    const k = back(pr(u, .5, 1.1));
    put($('.row', s), pr(u, .5, .8), `scale(${.82 + .18 * k})`);
    rise($('small', s), u, 1);
    $$('.tag', s).forEach((el, i) => pop(el, u, 1.5 + i * .125));
  },
  sClean(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('.vdev', s), u, .25, 80);
    const A = $('#fcA'), B = $('#fcB'), Cc = $('#fcC');
    // Kept: dragged right, then flies out of the phone.
    const da = eio(pr(u, 1.1, 1.5)), fa = ei(pr(u, 1.5, 2.2));
    put(A, 1 - pr(u, 2.0, 2.2), `translate(${50 * da + 1150 * fa}px, ${-70 * fa}px) rotate(${3 * da + 16 * fa}deg)`);
    $('.seal', A).style.opacity = pr(u, 1.1, 1.4);
    // Trashed: comes forward, dragged left, then flies out the other way.
    const ub = eo(pr(u, 1.6, 2.0)), db = eio(pr(u, 2.6, 3.0)), fb = ei(pr(u, 3.0, 3.7));
    put(B, 1 - pr(u, 3.5, 3.7), `translate(${-50 * db - 1150 * fb}px, ${12 * (1 - ub) - 70 * fb}px) rotate(${-3 * db - 16 * fb}deg) scale(${.95 + .05 * ub})`);
    $('.seal', B).style.opacity = pr(u, 2.6, 2.9);
    const uc = eo(pr(u, 3.1, 3.5));
    put(Cc, 1, `translateY(${12 * (1 - uc)}px) scale(${.95 + .05 * uc})`);
    // The buttons answer the swipe, and the count moves on.
    const [, trash, keep] = $$('.dbar .ra .o', s);
    keep.style.transform = `scale(${1 + .14 * Math.sin(Math.PI * pr(u, 1.1, 1.9))})`;
    trash.style.transform = `scale(${1 + .14 * Math.sin(Math.PI * pr(u, 2.6, 3.4))})`;
    const done = 3 + (u > 2.1) + (u > 3.5);
    $('.sbar .st', s).textContent = t('swipe_progress', done, 24);
    $('.meter b', s).style.width = `${done / 24 * 100}%`;
    // What the scan found, each size counting up.
    $$('.find', s).forEach((el, i) => {
      const at = 3.5 + i * .25, k = back(pr(u, at, at + .5));
      put(el, pr(u, at, at + .2), `translateX(${(1 - k) * 80}px)`);
      const em = $('em', el);
      em.textContent = bytes(Math.max(.001, +em.dataset.gb * eo(pr(u, at, at + .8))));
    });
  },
  sEdit(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('#wEdit', s), u, .25, 80);
    wiped($('#wEdit', s), eio(pr(u, 1, 2)));
    $$('.minis figure', s).forEach((el, i) => pop(el, u, 3 + i * .5, '', .7));
  },
  sBody(u, s) {
    rise($('.cap2', s), u, .1);
    const body = $('#bodyStage', s), food = $('#foodStage', s);
    const [fuller, plain, slim] = $$('.trio2 figure', s);
    put(body, 1 - pr(u, 3.0, 3.35));
    rise(plain, u, .25, 60);
    pop(fuller, u, 1, '', .8);
    pop(slim, u, 1.5, '', .8);
    const line = $('.line', s);
    put(line, pr(u, 2, 2.1), `scaleX(${eo(pr(u, 2, 2.5))})`);
    put(food, pr(u, 3.1, 3.45));
    wiped($('#wFood', s), eio(pr(u, 3.5, 4.5)));
  },
  sMove(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('.flow2', s), u, .2, 50);
    const icon = $('.kicon', s);
    icon.style.transform = `scale(${1 + .07 * Math.sin(Math.PI * pr(u, 1.6, 2.8))})`;
    const [ex, ey] = [ICON_X + 60, 75];
    $$('.thumb', s).forEach((el, i) => {
      const a = CELL(i), k = eio(pr(u, 1 + i * .125, 1.75 + i * .125));
      const x = a.x + (ex - a.x) * k, y = a.y + (ey - a.y) * k - Math.sin(Math.PI * k) * 50;
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      put(el, k <= 0 ? 0 : 1 - pr(k, .85, 1), `scale(${1 - .55 * k})`);
    });
    $$('.kinds2 figure', s).forEach((el, i) => pop(el, u, 3 + i * .25, '', .7));
  },
  sPriv(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('.vdev', s), u, .25, 80);
    $$('.fp span', s).forEach((ring, i) => {
      const k = pr(u, 1 + i * .25, 1.7 + i * .25);
      put(ring, k > 0 && k < 1 ? .7 * (1 - k) : 0, `scale(${1 + .8 * k})`);
    });
    $('.fp', s).style.transform = `scale(${1 - .08 * Math.sin(Math.PI * pr(u, 1, 1.4))})`;
    put($('.lockov', s), 1 - eo(pr(u, 2, 2.5)));
  },
  sFind(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('.vdev', s), u, .25, 80);
    const [search, map] = $$('.pw', s);
    rise(search, u, .4);
    $('.sfield span', s).textContent = QUERY.slice(0, Math.ceil(pr(u, .7, 1.5) * QUERY.length)).join('');
    put($('.scount', s), pr(u, 1.5, 1.8));
    $$('.callout .cell', search).forEach((el, i) => pop(el, u, 1.625 + i * .07, '', .4));
    rise(map, u, 2.0);
    $$('.pin', map).forEach((el, i) => pop(el, u, 2.5 + i * .125, 'translate(-50%,-50%)', 0));
  },
  sBack(u, s) {
    rise($('.cap2', s), u, .1);
    rise($('.vdev', s), u, .25, 80);
    const k = eio(pr(u, .8, 3.5)), n = Math.round(RUN.from + (RUN.to - RUN.from) * k);
    $('.hero small', s).textContent = t('progress_n_of_m', n, RUN.of);
    $('.hero + .meter b', s).style.width = `${n / RUN.of * 100}%`;
    const v = $('.pw', s);
    rise(v, u, .7, 60);
    $('.play', v).style.transform = `scale(${1 + .07 * Math.sin(u * 4)})`;
  },
  sCta(u, s) {
    put($('.wall2', s), 1, `rotate(-11deg) translateY(${-u * 26 - 60}px)`);
    const k = back(pr(u, .25, .85));
    put($('.row', s), pr(u, .25, .55), `scale(${.82 + .18 * k})`);
    rise($('small', s), u, .5);
    $$('.tag', s).forEach((el, i) => pop(el, u, .75 + i * .125));
    pop($('.ctabtn', s), u, 1.5);
  },
};

function render(time) {
  let dark = 0;
  SCENES.forEach(([id, start, end], i) => {
    const a = Math.min(i === 0 ? 1 : pr(time, start - XF / 2, start + XF / 2), i === SCENES.length - 1 ? 1 : 1 - pr(time, end - XF / 2, end + XF / 2));
    const s = document.getElementById(id);
    s.style.display = a > 0 ? 'block' : 'none';
    if (a <= 0) return;
    s.style.opacity = a;
    if (DARK.has(id)) dark = Math.min(1, dark + a);
    DRAW[id](time - start, s);
  });
  $('#film .dark').style.opacity = dark;
}

window.READY = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  $$('.scene').forEach(s => s.style.display = 'block');
  fitScreens();
  // A caption shrinks until it fits its column and no word sticks out of it.
  $$('.cap2').forEach(box => {
    const h = $('h1', box), p = $('p', box);
    let a = 78, b = 34;
    while ((h.scrollWidth > box.clientWidth + 1 || h.offsetHeight + p.offsetHeight > 820) && a > 44) {
      a -= 2; b = Math.max(26, b - .6); h.style.fontSize = a + 'px'; p.style.fontSize = b + 'px';
    }
  });
  // The tagline keeps to two lines.
  $$('.brand2 small').forEach(el => { for (let z = 54; el.offsetHeight > 140 && z > 34; z -= 1) el.style.fontSize = z + 'px'; });
  // The flying deck sits exactly over the phone's own deck.
  const dev = $('#sClean .vdev'), deck = $('#sClean .deck'), fly = $('#sClean .fly2');
  const d = dev.getBoundingClientRect(), r = deck.getBoundingClientRect();
  Object.assign(fly.style, { left:`${r.left - d.left}px`, top:`${r.top - d.top}px`, width:`${r.width}px`, height:`${r.height}px` });
  $$('.scene').forEach(s => s.style.display = 'none');
  render(0);
  return { duration:DUR, fps:FPS };
})();

// Opened in a browser: play it, or hold one moment with ?t=seconds.
if (!navigator.webdriver) READY.then(() => {
  const hold = new URLSearchParams(location.search).get('t');
  if (hold !== null) return render(+hold);
  const t0 = performance.now();
  const tick = () => { const time = (performance.now() - t0) / 1000 % DUR; render(time); requestAnimationFrame(tick); };
  tick();
});
</script>
