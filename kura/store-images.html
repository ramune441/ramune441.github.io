<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Kura Store Images</title>
<!--
  Kura（Android）の Google Play 掲載画像。record-store-i18n.mjs が要素ごとにスクショして
  images/store/<lang>/ に書き出す:
    #fg → store-image-feature.png (1024x500)
    #p1-#p5 → store-image-1..5.png（携帯電話 1080x1920）
  ?lang=xx: en ja zh zh-TW ko es fr de pt it ru id hi tr vi th pl ar nl bn（en が既定）。
  画面パーツと見た目は store-art.js / store-art.css（紹介動画 promo.html と共有）。画面の中の言葉はアプリの strings.xml から（store-images-app-strings.js、store-images-strings.mjs で生成）、
  キャプションと地名だけ store-images-i18n.js。色は ui/theme/Palette.kt、文字の大きさは Type.kt、書体は同梱の Geist（fonts/）。
  5枚: 1 紹介（写真の壁・写真タブ・思い出と場所のカード・4つの柱の札）／2 スワイプで片付け（飛んでいくカード・見つかった容量・連写のベスト）／
  3 {vault} に写真を隠す（暗い地）／4 ライブラリ（コレクション・人物・場所の地図・地名で検索）／5 写真も動画も元の画質でバックアップ（動画のカード・クラウドだけにある写真）。
  料金は載せない（ストアの決まりと国ごとの価格のため。料金は説明文とアプリの中）。
  検索の例は地名: 写っているものの名前（ML Kit のラベル）は英語だけなので、どの言語でも引ける地名で見せる。
  フィーチャーグラフィックは紹介の横長版（名前・タグライン・4つの柱の札＋写真の壁・写真タブ・思い出のプリント）。小さい字は載せない。
  写真は Unsplash License（picsum.photos 経由）。撮影者は images/photos/CREDITS.txt。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<link rel="stylesheet" href="store-art.css">
</head>
<body>
<div id="stage"></div>
<script src="store-images-app-strings.js"></script>
<script src="store-images-i18n.js"></script>
<script src="store-art.js"></script>
<script>
// ─────────────── assembling the canvases ───────────────
const PHONE = { w:400, h:866, cols:4, zoom:1.6 };

let html = '';
// The introduction leads the screenshots and sells Kura as a photo app first: a wall of photos, the photos tab in
// front, a memory and a place laid on top as prints, and the four parts (the feature graphic's titles) as tags.
// The prints and the phone's memories show other photos than the wall, so no picture appears twice side by side.
const WALL = [['p360', 'p164', 'p509', 'p292', 'p77'], ['p200', 'p516', 'p553', 'p437', 'p13'], ['p429', 'p392', 'p106', 'p565', 'p288'],
  ['p525', 'p152', 'p433', 'p450', 'p219'], ['p507', 'p488', 'p110', 'p237', 'p434'], ['p54', 'p169', 'p493', 'p327', 'p517']];
const HEIGHTS = [300, 380, 300, 340, 300];
const TAGS = `<span class="tag">${mi('photo_library')}${C.f1t}</span><span class="tag">${mi('cleaning_services')}${C.f2t}</span>
  <span class="tag">${mi('lock')}${fill(C.f3t)}</span><span class="tag">${mi('cloud_done')}${fill(C.f4t)}</span>`;
// The feature graphic is the introduction turned sideways: the name, the tagline and the four parts on solid green,
// the wall, the photos tab and a memory print to the right. No small print: Play shows it small.
html += `<section class="shot" id="fg">
  <div class="wall">${WALL.slice(1, 5).map((col, c) => `<div class="col" style="margin-top:${[60, 0, 110, 30][c]}px">
    ${col.map((src, i) => `<img src="${P(src)}" style="height:${HEIGHTS[(i + c) % HEIGHTS.length] * .55}px">`).join('')}</div>`).join('')}</div>
  <div class="fade"></div>
  <div class="left">
    <div class="brand">${ICON_SVG('16 16 76 76')}<b>${t('app_name')}</b></div>
    <small>${t('brand_tagline')}</small>
    <div class="tags">${TAGS}</div>
  </div>
  <div class="device">${screen('photos', { w:400, h:866, cols:4, zoom:.61 })}</div>
  <div class="print" style="zoom:.46;left:1265px;top:540px;transform:rotate(-7deg)">
    ${photoCard({ src:'p401', title:t('session_today'), detail:`2023 · ${pl('stats_items', 12)}`, w:330, h:420, style:'object-position:30% 50%' })}
    <div class="foot">${mi('auto_awesome', 'mo')}${t('memories_title')}</div></div>
  <div class="heart" style="zoom:.46;left:1600px;top:500px">${mi('favorite')}</div>
</section>`;
html += `<section class="shot phone intro" id="p1">
  <div class="wall">${WALL.map((col, c) => `<div class="col" style="margin-top:${[120, 0, 200, 60, 160, 20][c]}px">
    ${col.map((src, i) => `<img src="${P(src)}" style="height:${HEIGHTS[(i + c) % HEIGHTS.length]}px">`).join('')}</div>`).join('')}</div>
  <div class="fade"></div>
  <div class="brand">
    <div class="row">${ICON_SVG('16 16 76 76')}<b>${t('app_name')}</b></div>
    <small>${t('brand_tagline')}</small>
    <div class="tags">
      ${TAGS}
    </div>
  </div>
  <div class="device">${screen('photos', PHONE)}</div>
  <div class="print" style="left:22px;top:1010px;transform:rotate(-7deg)">
    ${photoCard({ src:'p401', title:t('session_today'), detail:`2023 · ${pl('stats_items', 12)}`, w:330, h:420, style:'object-position:30% 50%' })}
    <div class="foot">${mi('auto_awesome', 'mo')}${t('memories_title')}</div></div>
  <div class="heart" style="left:300px;top:970px">${mi('favorite')}</div>
  <div class="print" style="right:22px;top:1330px;transform:rotate(6deg)">
    ${photoCard({ src:'p436', title:C.cities[2], detail:`2025 · ${pl('stats_items', 23)}`, w:320, h:300 })}
    <div class="foot">${mi('place', 'mo')}${t('places_title')}</div></div>
</section>`;
const shot = (id, cls, h, s, body) => `<section class="shot phone ${cls}" id="${id}">${ROOF(1300, 'left:-110px;top:40px')}
  <div class="cap"><h1>${h}</h1><p>${s}</p></div>${body}</section>`;
const device = (name, f = PHONE) => `<div class="device">${screen(name, f)}</div>`;
// A zoomed callout's left/top are zoomed too: top:860px at zoom 1.5 sits 1290px down the canvas.
const callout = (extra, st) => `<div class="callout" style="${st}">${extra()}</div>`;
// 2: sorting and cleanup in one. The photo just kept flies out of the phone; beside it, what the scan found and the burst's best.
const FOUND = [['content_copy', t('session_dup'), 1.9, 'primary'], ['burst_mode', t('session_similar'), 5.7, 'primary'],
  ['blur_on', t('session_blurry'), .61, 'tertiary'], ['sd_card', t('session_large'), 6.4, 'tertiary']];
html += shot('p2', 'clean', C.h2, C.s2, `${device('swipe', { ...PHONE, zoom:1.45 })}
  <div class="fly" style="left:530px;top:500px;width:360px;height:470px;transform:rotate(13deg)"><img src="${P('p1025')}" style="object-position:50% 40%">
    ${seal(t('swipe_keep'), '#236B46', 'left', -9)}</div>
  <div class="finds" style="top:1030px">
    ${FOUND.map(([icon, name, gb, tone]) => `<div class="find"><span class="dsc" style="background:var(--${tone}C);color:var(--on${tone[0].toUpperCase() + tone.slice(1)}C)">${mi(icon, 'mo')}</span>
      <div><b>${name}</b><em>${bytes(gb)}</em></div></div>`).join('')}
    ${callout(burstCallout, 'position:relative;zoom:1.2')}
  </div>`);
html += shot('p3', 'dark', t('intro_private_title'), t('intro_private_text', t('lib_vault')),
  `${device('vault')}${callout(privateCallout, 'zoom:1.5;left:27px;top:853px')}`);
html += shot('p4', '', C.h4, C.s4,
  `${device('collections')}${callout(searchCallout, 'zoom:1.5;right:16px;top:860px')}${callout(mapCallout, 'zoom:1.5;left:16px;top:947px')}`);
html += shot('p5', '', C.h5, C.s5, `${device('cloud')}${callout(videoCallout, 'zoom:1.5;left:16px;top:860px')}`);
document.getElementById('stage').innerHTML = html;

// Captions shrink until they fit their box, so no language overflows.
function fit(box) {
  const h1 = box.querySelector('h1'), p = box.querySelector('p');
  let s1 = parseFloat(getComputedStyle(h1).fontSize), s2 = p ? parseFloat(getComputedStyle(p).fontSize) : 0;
  const used = () => [...box.children].reduce((a, c) => a + c.offsetHeight, 0) + parseFloat(getComputedStyle(box).rowGap) * (box.children.length - 1);
  const wide = () => h1.scrollWidth > box.clientWidth + 1 || (p && p.scrollWidth > box.clientWidth + 1);
  for (let n = 0; n < 40 && (used() > box.clientHeight || wide()); n++) {
    s1 *= .96; h1.style.fontSize = s1 + 'px';
    if (p) { s2 = Math.max(s2 * .975, 22); p.style.fontSize = s2 + 'px'; }
  }
}
window.READY = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await new Promise(r => setTimeout(r, 300));
  fitScreens();
  document.querySelectorAll('.cap').forEach(fit);
  // The feature graphic's tagline stays on one line and its tags on two rows, inside the green.
  const fgLine = document.querySelector('#fg .left > small');
  for (let s = 30; fgLine.scrollWidth > fgLine.clientWidth && s > 18; s -= .5) fgLine.style.fontSize = s + 'px';
  const fgTags = document.querySelector('#fg .tags');
  for (let s = 28; fgTags.offsetHeight > 140 && s > 18; s -= .5) fgTags.querySelectorAll('.tag').forEach(el => el.style.fontSize = s + 'px');
  // A print's place name stays on one line.
  document.querySelectorAll('.print .tx b').forEach(b => shrink(b, 24));
  // The tagline stays on one line, within the brand's width (as a flex item it grows to its text); the tags stay on two rows.
  const intro = document.querySelector('.intro .brand small');
  for (let s = 46; intro.offsetWidth > intro.parentElement.clientWidth && s > 28; s -= .5) intro.style.fontSize = s + 'px';
  const tags = document.querySelector('.intro .tags');
  for (let s = 28; tags.offsetHeight > 140 && s > 20; s -= .5) tags.querySelectorAll('.tag').forEach(el => el.style.fontSize = s + 'px');
  return true;
})();
</script>
</body>
</html>
