<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Kura Store Images</title>
<!--
  Kura（Android）の Google Play 掲載画像。record-store-i18n.mjs が要素ごとにスクショして
  images/store/<lang>/ に書き出す:
    #fg → store-image-feature.png (1024x500)
    #p1-#p5 → store-image-1..5.png（携帯電話 1080x1920）
    #t1-#t5 → store-image-tablet-1..5.png（タブレット 1080x1920 縦。7インチ・10インチ両方の枠に使える）
  ?lang=xx: en ja zh zh-TW ko es fr de pt it ru id（en が既定）。
  画面の中の言葉はアプリの strings.xml から（store-images-app-strings.js、store-images-strings.mjs で生成）、
  キャプションだけ store-images-i18n.js。色は ui/theme/Palette.kt、文字の大きさは Type.kt、書体は同梱の Geist（fonts/）。
  5枚の流れ: 写真タブ（アルバム・場所は説明文で）→ スワイプで仕分け（連写のベストを横に添える）→ 容量を食うもの（端末内で解析）→ {vault} に写真を隠す → 写真も動画も月額いくらでバックアップ（料金の画面）。
  フィーチャーグラフィックは写真管理アプリとして見せる（写真タブの画面＋ライブラリ・片付け・金庫・バックアップの4点）。
  写真は Unsplash License（picsum.photos 経由）。撮影者は images/photos/CREDITS.txt。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<style>
@font-face { font-family:'Geist'; font-weight:400; src:url('fonts/geist_regular.ttf'); }
@font-face { font-family:'Geist'; font-weight:500; src:url('fonts/geist_medium.ttf'); }
@font-face { font-family:'Geist'; font-weight:600; src:url('fonts/geist_semibold.ttf'); }
@font-face { font-family:'Geist'; font-weight:700; src:url('fonts/geist_bold.ttf'); }
@font-face { font-family:'Geist'; font-weight:800; src:url('fonts/geist_bold.ttf'); }

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cjk: 'Noto Sans JP';
  --ui: 'Geist', var(--cjk), 'Roboto', sans-serif;
  /* ui/theme/Palette.kt, light scheme */
  --primary:#236B46; --onPrimary:#FFFFFF; --primaryC:#D6E8DC; --onPrimaryC:#0B3B24; --inversePrimary:#8FCBA6;
  --secondary:#57534B; --secondaryC:#E7E3DA; --onSecondaryC:#25231F;
  --tertiary:#8A5A13; --tertiaryC:#F4E2C6; --onTertiaryC:#2E1B00;
  --error:#B3261E; --errorC:#F9DEDA; --onErrorC:#410E0B;
  --bg:#F6F5F1; --on:#1B1B19; --onVar:#5F5D57;
  --cLow:#EFEEE9; --c:#EAE8E2; --cHigh:#E4E2DB; --cHighest:#DEDCD5;
  --outline:#8E8B84; --outlineVar:#D6D3CB;
  --onPhoto:rgba(0,0,0,.55);
}
body { background:#2a2d2b; font-family:var(--ui); -webkit-font-smoothing:antialiased; padding:40px 0; }
.mi, .mo { font-family:'Material Icons'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal;
  text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; font-feature-settings:'liga'; -webkit-font-feature-settings:'liga'; }
.mo { font-family:'Material Icons Outlined'; }

/* ═════════ canvases ═════════ */
.shot { position:relative; overflow:hidden; margin:0 auto 60px; background:var(--primary); color:#fff; }
.shot.phone { width:1080px; height:1920px; }
.shot.tablet { width:1080px; height:1920px; }
.roof { position:absolute; pointer-events:none; }
.cap h1 { font-weight:800; letter-spacing:-.025em; line-height:1.1; color:#fff; }
.cap p { font-weight:500; line-height:1.34; color:#CDEBD7; }
body.cjk .cap h1 { letter-spacing:-.01em; line-height:1.22; }
/* CJK captions break only at punctuation and spaces, never mid-word ("見つけ/る"); fit() shrinks what won't fit. */
body.cjk .cap h1, body.cjk .cap p, body.cjk #fg h1 { word-break:keep-all; }
/* Arabic, Hindi and Thai letters join or stack: no tracking, as in the app (ui/theme/Type.kt). */
body.untracked *:not(.mi):not(.mo) { letter-spacing:0 !important; }
/* Arabic reads right to left inside the phone and in the words; the frames stay where they are. */
body.rtl .scr, body.rtl .cap, body.rtl #fg .left { direction:rtl; }
.phone .cap, .tablet .cap { position:absolute; left:70px; right:70px; top:92px; height:330px; text-align:center;
  display:flex; flex-direction:column; justify-content:center; gap:22px; }
.phone .cap h1, .tablet .cap h1 { font-size:84px; }
.phone .cap p, .tablet .cap p { font-size:38px; }

/* the device */
.device { position:absolute; background:#111210; box-shadow:0 40px 90px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.06); }
.phone .device { left:206px; top:476px; width:668px; padding:14px; border-radius:66px; }
.phone .device .glass { border-radius:52px; }
.tablet .device { left:72px; top:470px; padding:18px; border-radius:46px; }
.tablet .device .glass { border-radius:28px; }
.glass { overflow:hidden; position:relative; }
.cam { position:absolute; width:22px; height:22px; border-radius:50%; background:#0b0b0a; left:50%; top:22px; transform:translateX(-50%); z-index:9;
  box-shadow:inset 0 0 0 3px #1c1d1b; }
.tablet .cam { top:-13px; width:9px; height:9px; box-shadow:none; background:#262724; }
.tablet .glass { overflow:visible; }
.tablet .scr { border-radius:28px; }

/* ═════════ app screens (in dp) ═════════ */
.scr { background:var(--bg); color:var(--on); display:flex; flex-direction:column; overflow:hidden; position:relative; font-family:var(--ui); }
.sb { height:32px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px 0 26px; font-size:14px; font-weight:500; }
.sb .ic { display:flex; gap:4px; align-items:center; }
.sb .ic i { font-size:16px; }
.body { flex:1; min-height:0; overflow:hidden; position:relative; }
.nav { flex:none; background:var(--bg); border-top:1px solid rgba(214,211,203,.6); }
.nav .row { height:68px; display:flex; }
.nav .it { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:10px; }
.nav .pill { width:60px; height:32px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:var(--onVar); }
.nav .pill i { font-size:24px; }
.nav .it.on .pill { background:var(--primaryC); color:var(--onPrimaryC); }
.nav .lb { font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; color:var(--onVar); white-space:nowrap; max-width:100%; overflow:hidden; padding:0 2px; }
.nav .it.on .lb { color:var(--on); font-weight:600; }
.gest { height:22px; display:flex; align-items:center; justify-content:center; }
.gest b { width:108px; height:4px; border-radius:2px; background:#1B1B19; opacity:.85; }

.th { position:relative; height:80px; flex:none; }
.th.sub { height:96px; }
.th .tt { position:absolute; left:20px; bottom:13px; right:120px; }
.th h2 { font-size:30px; line-height:36px; font-weight:700; letter-spacing:-.6px; white-space:nowrap; }
.th .st { font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); margin-top:2px; }
.acts { position:absolute; right:8px; top:6px; display:flex; }
.acts i, .sbar .acts i { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--on); }
.sbar { height:64px; flex:none; display:flex; align-items:center; padding:0 8px 0 4px; gap:4px; position:relative; }
.sbar > i { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:24px; }
.sbar h3 { font-size:20px; line-height:26px; font-weight:600; letter-spacing:-.3px; white-space:nowrap; }
.sbar .st { font-size:13px; line-height:18px; color:var(--onVar); font-weight:500; }

.lbl { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
.lbl span { font-size:16px; line-height:22px; font-weight:700; letter-spacing:-.15px; }
.lbl em { font-style:normal; color:var(--primary); font-size:14px; font-weight:500; }
.panel { background:var(--cLow); border-radius:24px; padding:16px 18px; }
.hscroll { display:flex; gap:10px; padding:0 16px; overflow:hidden; }

.card { position:relative; flex:none; border-radius:18px; overflow:hidden; background:var(--cHigh); }
.card > img, .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.card .scrim { position:absolute; left:0; right:0; bottom:0; height:62%; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62)); }
.card .tx { position:absolute; left:12px; right:10px; bottom:10px; color:#fff; }
.card .tx b { display:block; font-size:14px; line-height:20px; font-weight:600; letter-spacing:-.05px; overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.card .tx small { display:block; font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .disc { position:absolute; left:8px; top:8px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.card .disc i { font-size:16px; }

.chips { padding:2px 16px 6px; display:flex; flex-direction:column; gap:8px; }
.chips div { display:flex; gap:8px; }
.chip { height:32px; border-radius:16px; border:1px solid var(--outlineVar); display:inline-flex; align-items:center; gap:6px; padding:0 14px;
  font-size:14px; font-weight:500; color:var(--onVar); white-space:nowrap; background:var(--bg); }
.chip i { font-size:18px; }
.chip.dd { padding-right:8px; }
/* a piece of an app screen laid over the canvas, beside the phone (shot 2: the burst strip) */
.callout { position:absolute; z-index:5; background:var(--bg); color:var(--on); font-family:var(--ui); border-radius:24px; padding:14px;
  box-shadow:0 30px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:10px; }
.callout .hd { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
.callout .hd i { font-size:18px; color:var(--primary); }
.callout .hd small { margin-left:auto; font-size:12px; font-weight:500; color:var(--onVar); white-space:nowrap; }
#fg .device { left:668px; top:44px; width:316px; padding:8px; border-radius:38px; }
#fg .device .glass { border-radius:30px; }
#fg .cam { width:10px; height:10px; top:10px; box-shadow:none; }

.mh { font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.4px; padding:14px 16px 2px; }
.dh { height:42px; display:flex; align-items:center; padding:0 10px 0 16px; gap:8px; }
.dh b { font-size:14px; font-weight:600; flex:1; }
.dh small { font-size:12px; color:var(--onVar); font-weight:500; }
.dh i { font-size:22px; color:var(--outline); }
.grid { display:grid; gap:2px; }
.cell { position:relative; aspect-ratio:1; overflow:hidden; background:var(--cHigh); }
.cell img { width:100%; height:100%; object-fit:cover; display:block; }
.cell .cl { position:absolute; right:5px; bottom:5px; color:#fff; font-size:15px; filter:drop-shadow(0 0 2px rgba(0,0,0,.6)); }
.cell .vd { position:absolute; right:5px; top:5px; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; gap:1px;
  text-shadow:0 0 3px rgba(0,0,0,.7); }
.cell .vd i { font-size:14px; filter:drop-shadow(0 0 2px rgba(0,0,0,.6)); }

.meter { height:6px; border-radius:3px; background:var(--cHighest); overflow:hidden; }
.meter b { display:block; height:100%; border-radius:3px; background:var(--primary); }
.big .l { font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.big .v { font-size:40px; line-height:46px; font-weight:700; letter-spacing:-1px; }
.big .s { font-size:14px; line-height:20px; color:var(--onVar); }
.share { display:flex; gap:3px; height:8px; border-radius:4px; overflow:hidden; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--onVar); }
.legend span b { color:var(--on); font-weight:500; }
.legend span i { width:8px; height:8px; border-radius:50%; display:block; }

/* swipe */
.deck { position:relative; flex:1; min-height:0; }
.mcard { position:absolute; inset:0; border-radius:24px; overflow:hidden; background:#000; }
.mcard img { width:100%; height:100%; object-fit:cover; display:block; }
.seal { position:absolute; top:28px; padding:4px; border-radius:10px; background:rgba(255,255,255,.92); border:2.5px solid; }
.seal span { display:block; border:1px solid; border-radius:7px; padding:2px 14px; font-size:26px; line-height:32px; font-weight:700; letter-spacing:2px; }
.meta { text-align:center; font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dbar { display:flex; justify-content:center; align-items:flex-end; gap:18px; }
/* As in the app: keep is a swipe to the right, so its button stays on the right in Arabic too. */
.dbar { direction:ltr; }
.ra { display:flex; flex-direction:column; align-items:center; gap:6px; }
.ra .o { border-radius:50%; display:flex; align-items:center; justify-content:center; }
.ra small { font-size:13px; line-height:18px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.hint { text-align:center; font-size:12px; line-height:17px; color:var(--onVar); }
.pillw { display:inline-block; font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; padding:3px 9px; border-radius:99px; white-space:nowrap; }

/* burst */
.strip { display:flex; gap:6px; padding:0 2px; }
.sth { position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; background:var(--cHigh); flex:none; }
.sth .ph { transform-origin:center; }
.sth.f::after { content:''; position:absolute; inset:0; border:2.5px solid var(--primary); border-radius:10px; }
.mb { position:absolute; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.mb i { font-size:13px; }
.qc { height:32px; border-radius:16px; border:1px solid var(--outlineVar); background:var(--cLow); display:inline-flex; align-items:center; gap:6px;
  padding:0 12px 0 10px; font-size:14px; font-weight:500; white-space:nowrap; }
.qc i { font-size:16px; color:var(--primary); }

/* cloud */
.stack { display:flex; flex-direction:column; gap:16px; padding:4px 16px 24px; }
.sec .lbl { padding:0 4px; }
.plan { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:18px; background:var(--bg); border:1.5px solid transparent; }
.plan.cur { border:2px solid var(--primary); }
.plan .n { flex:1; }
.plan .n b { display:block; font-size:16px; line-height:22px; font-weight:600; }
.plan .n small { display:block; font-size:13px; line-height:18px; color:var(--onVar); }
.plan .p { font-size:14px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.plan.cur .p { color:var(--primary); font-weight:600; }
.plan i { font-size:22px; color:var(--primary); }
.tbtn { color:var(--primary); font-size:14px; font-weight:500; padding:4px 0 0; }
.sw { display:flex; align-items:center; gap:14px; }
.sw .n { flex:1; }
.sw .n b { display:block; font-size:16px; line-height:24px; font-weight:400; }
.sw .n small { display:block; font-size:12px; line-height:17px; color:var(--onVar); }
.switch { width:52px; height:32px; border-radius:16px; background:var(--primary); position:relative; flex:none; }
.switch b { position:absolute; right:4px; top:4px; width:24px; height:24px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
.switch b i { font-size:16px; color:var(--primary); }
.okline { display:flex; gap:8px; align-items:center; font-size:14px; line-height:20px; color:var(--onVar); }
.okline i { font-size:20px; color:var(--primary); }

/* ═════════ feature graphic ═════════ */
#fg { width:1024px; height:500px; }
/* The feature graphic sells what Kura does: four feature cards lead, the backup card carries the price. */
#fg .left { position:absolute; left:48px; top:40px; bottom:40px; width:590px; display:flex; flex-direction:column; gap:22px; }
#fg .brand { display:flex; align-items:center; gap:16px; }
#fg .brand svg { width:66px; height:66px; border-radius:17px; box-shadow:0 0 0 2px rgba(255,255,255,.18); flex:none; }
#fg .brand b { display:block; font-size:44px; line-height:1; font-weight:700; letter-spacing:-1.2px; }
#fg .brand > div { flex:1; min-width:0; }
#fg .brand small { display:block; font-size:18px; font-weight:500; color:#CDEBD7; margin-top:7px; white-space:nowrap; overflow:hidden; }
#fg .feats { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:14px; }
#fg .ft { border-radius:22px; padding:16px 18px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
  display:flex; flex-direction:column; justify-content:center; gap:4px; overflow:hidden; }
#fg .ft i { width:40px; height:40px; border-radius:50%; background:var(--inversePrimary); color:var(--onPrimaryC); font-size:22px;
  display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
#fg .ft b { font-size:25px; line-height:1.15; font-weight:700; letter-spacing:-.4px; }
#fg .ft small { font-size:16px; line-height:1.3; font-weight:500; color:#CDEBD7; }
#fg .ft.hi { background:#fff; border-color:#fff; color:var(--primary); box-shadow:0 18px 40px rgba(0,0,0,.25); }
#fg .ft.hi i { background:var(--primary); color:#fff; }
#fg .ft.hi small { color:var(--onVar); }
body.cjk #fg .ft b { letter-spacing:0; word-break:keep-all; }

</style>
</head>
<body>
<div id="stage"></div>
<script src="store-images-app-strings.js"></script>
<script src="store-images-i18n.js"></script>
<script>
const CAP = window.STORE_I18N;

// ─────────────── language ───────────────
const L = new URLSearchParams(location.search).get('lang') || 'en';
// Folder codes (images/store/<lang>) → the locale for dates, plurals and numbers.
// Thai dates in the Gregorian years the app shows, not the Buddhist era a browser picks for th.
const LOC = { zh:'zh-CN', pt:'pt-BR', th:'th-TH-u-ca-gregory' }[L] || L;
const A = APP_STRINGS[L], EN = APP_STRINGS.en, C = CAP[L];
document.documentElement.lang = LOC;
const CJK = { ja:'Noto Sans JP', zh:'Noto Sans SC', 'zh-TW':'Noto Sans TC', ko:'Noto Sans KR' }[L];
if (CJK) {
  document.body.classList.add('cjk');
  document.documentElement.style.setProperty('--cjk', `'${CJK}'`);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${CJK.replace(/ /g, '+')}:wght@400;500;600;700;800&display=block`;
  document.head.appendChild(link);
}
// Scripts Geist does not draw: their Noto face, through the same fallback slot as CJK.
const SCRIPT = { hi:'Noto Sans Devanagari', th:'Noto Sans Thai', ar:'Noto Sans Arabic' }[L];
if (SCRIPT) {
  document.body.classList.add('untracked');
  document.documentElement.style.setProperty('--cjk', `'${SCRIPT}'`);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${SCRIPT.replace(/ /g, '+')}:wght@400;500;600;700;800&display=block`;
  document.head.appendChild(link);
}
if (L === 'ar') document.body.classList.add('rtl');
// Which way the start of a row lies, for strips shifted by hand (a transform is not mirrored).
const START = L === 'ar' ? -1 : 1;
const fmt = (s, a) => { let i = 0; return s.replace(/%(\d+)\$[ds]|%[ds]/g, (m, p) => String(p ? a[p - 1] : a[i++])); };
const t = (k, ...a) => fmt(A[k] ?? EN[k], a);
const pl = (k, n, ...a) => { const f = A[k] ?? EN[k]; return fmt(f[new Intl.PluralRules(LOC).select(n)] ?? f.other, [n, ...a]); };
// domain/ByteFormat.kt: decimal units, Locale.US, one decimal under 100.
const bytes = gb => { let v = gb * 1e9, u = -1; const U = ['KB','MB','GB','TB']; while (v >= 1000 && u < 3) { v /= 1000; u++; }
  return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + U[u]; };
const D = (y, m, d, h = 12, mi = 0, s = 0) => new Date(y, m - 1, d, h, mi, s);
const TODAY = D(2026, 9, 28);
const df = (o, d) => new Intl.DateTimeFormat(LOC, o).format(d);
const monthTitle = (y, m) => df({ year:'numeric', month:'long' }, D(y, m, 1));
const shortMonth = (y, m) => df({ year:'numeric', month:'short' }, D(y, m, 1));
const dayTitle = d => { const diff = Math.round((TODAY - d) / 864e5);
  return diff === 0 ? t('day_today') : diff === 1 ? t('day_yesterday') : df({ weekday:'short', month:'short', day:'numeric' }, d); };
const P = n => `images/photos/${n}.jpg`;
// Plan prices (Play: USD $0.99 / $4.99 / $9.99, Japan ¥160 / ¥780 / ¥1,580). Other countries pay Play's conversion,
// which is not known here, so they see the USD price written with the currency code.
const price = usd => L === 'ja' ? { .99:'¥160', 4.99:'¥780', 9.99:'¥1,580' }[usd]
  : L === 'en' ? '$' + usd.toFixed(2)
  : new Intl.NumberFormat(LOC, { style:'currency', currency:'USD', currencyDisplay:'code' }).format(usd);
const priced = s => s.replace('{p1}', price(.99)).replace('{p2}', price(4.99)).replace('{p3}', price(9.99));
// {vault} = the app's own name for the vault (lib_vault: Private / プライベート / Tresor …), so a rename in the app carries over.
// A size never splits from its unit across lines ("500 GB").
const fill = s => priced(s).replace(/\{vault\}/g, t('lib_vault')).replace(/(\d) (GB|TB|Go|To|ГБ|ТБ)/g, '$1 $2');
// "Keep what matters.<br>Clear the rest." — the tagline breaks after its first clause, in every language.
// A full stop inside the line wins ("Behalte, was zählt.<br>Räum…"); otherwise the first comma (ja, ko, zh).
const twoLines = s => /^.+?[.。!！?？]\s*\S/u.test(s)
  ? s.replace(/^(.+?[.。!！?？])\s*(?=\S)/u, '$1<br>')
  : s.replace(/^(.+?[、，,])\s*(?=\S)/u, '$1<br>');
const mi = (n, cls = 'mi', st = '') => `<i class="${cls}" style="${st}">${n}</i>`;

// Captions shrink until they fit their box, so no language overflows.
function fit(box) {
  const h1 = box.querySelector('h1'), p = box.querySelector('p');
  let s1 = parseFloat(getComputedStyle(h1).fontSize), s2 = p ? parseFloat(getComputedStyle(p).fontSize) : 0;
  const used = () => [...box.children].reduce((a, c) => a + c.offsetHeight, 0) + parseFloat(getComputedStyle(box).rowGap) * (box.children.length - 1);
  const wide = () => h1.scrollWidth > box.clientWidth + 1 || (p && p.scrollWidth > box.clientWidth + 1);
  for (let n = 0; n < 40 && (used() > box.clientHeight || wide()); n++) {
    s1 *= .96; h1.style.fontSize = s1 + 'px';
    if (p) { s2 = Math.max(s2 * .975, 22); p.style.fontSize = s2 + 'px'; }
  }
}
// Tab labels shrink to 9sp to stay on one line (NavBar.kt); screen-bar titles likewise.
function shrink(el, min) {
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && s > min) { s -= .5; el.style.fontSize = s + 'px'; }
}
window.READY = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await new Promise(r => setTimeout(r, 300));
  document.querySelectorAll('.nav .lb').forEach(el => shrink(el, 9));
  document.querySelectorAll('.th h2').forEach(el => { el.style.overflow = 'hidden'; shrink(el, 20); });
  document.querySelectorAll('.cap').forEach(fit);
  // Feature cards: shrink a long title (and its line) until the card holds it; the tagline stays on one line.
  document.querySelectorAll('#fg .ft').forEach(ft => {
    const b = ft.querySelector('b'), sm = ft.querySelector('small');
    for (let s = 25, t2 = 16; (ft.scrollHeight > ft.clientHeight || b.scrollWidth > b.clientWidth) && s > 15; s -= 1, t2 = Math.max(13, t2 - .4)) {
      b.style.fontSize = s + 'px'; sm.style.fontSize = t2 + 'px';
    }
  });
  const tag = document.querySelector('#fg .brand small');
  for (let s = 18; tag.scrollWidth > tag.clientWidth && s > 12; s -= .5) tag.style.fontSize = s + 'px';
  return true;
})();
</script>
