<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Kura Store Images</title>
<!--
  Kura（Android）の Google Play 掲載画像。record-store-i18n.mjs が要素ごとにスクショして
  images/store/<lang>/ に書き出す:
    #fg → store-image-feature.png (1024x500)
    #p1-#p5 → store-image-1..5.png（携帯電話 1080x1920）
  ?lang=xx: en ja zh zh-TW ko es fr de pt it ru id hi tr vi th pl ar nl bn（en が既定）。
  画面の中の言葉はアプリの strings.xml から（store-images-app-strings.js、store-images-strings.mjs で生成）、
  キャプションと地名だけ store-images-i18n.js。色は ui/theme/Palette.kt、文字の大きさは Type.kt、書体は同梱の Geist（fonts/）。
  5枚: 1 紹介（写真の壁・写真タブ・思い出と場所のカード・4つの柱の札）／2 スワイプで片付け（飛んでいくカード・見つかった容量・連写のベスト）／
  3 {vault} に写真を隠す（暗い地）／4 ライブラリ（コレクション・人物・場所の地図・地名で検索）／5 写真も動画も元の画質でバックアップ（動画のカード・クラウドだけにある写真）。
  料金は載せない（ストアの決まりと国ごとの価格のため。料金は説明文とアプリの中）。
  検索の例は地名: 写っているものの名前（ML Kit のラベル）は英語だけなので、どの言語でも引ける地名で見せる。
  フィーチャーグラフィックは紹介の横長版（名前・タグライン・4つの柱の札＋写真の壁・写真タブ・思い出のプリント）。小さい字は載せない。
  写真は Unsplash License（picsum.photos 経由）。撮影者は images/photos/CREDITS.txt。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<style>
@font-face { font-family:'Geist'; font-weight:400; src:url('fonts/geist_regular.ttf'); }
@font-face { font-family:'Geist'; font-weight:500; src:url('fonts/geist_medium.ttf'); }
@font-face { font-family:'Geist'; font-weight:600; src:url('fonts/geist_semibold.ttf'); }
@font-face { font-family:'Geist'; font-weight:700; src:url('fonts/geist_bold.ttf'); }
@font-face { font-family:'Geist'; font-weight:800; src:url('fonts/geist_bold.ttf'); }

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cjk: 'Noto Sans JP';
  --ui: 'Geist', var(--cjk), 'Roboto', sans-serif;
  /* ui/theme/Palette.kt, light scheme */
  --primary:#236B46; --onPrimary:#FFFFFF; --primaryC:#D6E8DC; --onPrimaryC:#0B3B24; --inversePrimary:#8FCBA6;
  --secondary:#57534B; --secondaryC:#E7E3DA; --onSecondaryC:#25231F;
  --tertiary:#8A5A13; --tertiaryC:#F4E2C6; --onTertiaryC:#2E1B00;
  --error:#B3261E; --errorC:#F9DEDA; --onErrorC:#410E0B;
  --bg:#F6F5F1; --on:#1B1B19; --onVar:#5F5D57;
  --cLow:#EFEEE9; --c:#EAE8E2; --cHigh:#E4E2DB; --cHighest:#DEDCD5;
  --outline:#8E8B84; --outlineVar:#D6D3CB;
  --onPhoto:rgba(0,0,0,.55);
}
body { background:#2a2d2b; font-family:var(--ui); -webkit-font-smoothing:antialiased; padding:40px 0; }
.mi, .mo { font-family:'Material Icons'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal;
  text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; font-feature-settings:'liga'; -webkit-font-feature-settings:'liga'; }
.mo { font-family:'Material Icons Outlined'; }

/* ═════════ canvases ═════════ */
.shot { position:relative; overflow:hidden; margin:0 auto 60px; background:var(--primary); color:#fff; }
.shot.phone { width:1080px; height:1920px; }
.roof { position:absolute; pointer-events:none; }
.cap h1 { font-weight:800; letter-spacing:-.025em; line-height:1.1; color:#fff; }
.cap p { font-weight:500; line-height:1.34; color:#CDEBD7; }
body.cjk .cap h1 { letter-spacing:-.01em; line-height:1.22; }
/* CJK captions break only at punctuation and spaces, never mid-word ("見つけ/る"); fit() shrinks what won't fit. */
body.cjk .cap h1, body.cjk .cap p { word-break:keep-all; }
/* Arabic, Hindi, Thai and Bengali letters join or stack: no tracking, as in the app. */
body.untracked *:not(.mi):not(.mo) { letter-spacing:0 !important; }
/* Arabic reads right to left inside the phone and in the words; the frames stay where they are. */
body.rtl .scr, body.rtl .cap, body.rtl #fg .left, body.rtl .intro .brand, body.rtl .print { direction:rtl; }
.phone .cap { position:absolute; left:70px; right:70px; top:92px; height:330px; text-align:center;
  display:flex; flex-direction:column; justify-content:center; gap:22px; }
.phone .cap h1 { font-size:84px; }
.phone .cap p { font-size:38px; }

/* the device */
.device { position:absolute; background:#111210; box-shadow:0 40px 90px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.06); }
.phone .device { left:206px; top:476px; width:668px; padding:14px; border-radius:66px; }
.phone .device .glass { border-radius:52px; }
.glass { overflow:hidden; position:relative; }
.cam { position:absolute; width:22px; height:22px; border-radius:50%; background:#0b0b0a; left:50%; top:22px; transform:translateX(-50%); z-index:9;
  box-shadow:inset 0 0 0 3px #1c1d1b; }

/* ═════════ app screens (in dp) ═════════ */
.scr { background:var(--bg); color:var(--on); display:flex; flex-direction:column; overflow:hidden; position:relative; font-family:var(--ui); }
.sb { height:32px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px 0 26px; font-size:14px; font-weight:500; }
.sb .ic { display:flex; gap:4px; align-items:center; }
.sb .ic i { font-size:16px; }
.body { flex:1; min-height:0; overflow:hidden; position:relative; }
.nav { flex:none; background:var(--bg); border-top:1px solid rgba(214,211,203,.6); }
.nav .row { height:68px; display:flex; }
.nav .it { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:10px; }
.nav .pill { width:60px; height:32px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:var(--onVar); }
.nav .pill i { font-size:24px; }
.nav .it.on .pill { background:var(--primaryC); color:var(--onPrimaryC); }
.nav .lb { font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; color:var(--onVar); white-space:nowrap; max-width:100%; overflow:hidden; padding:0 2px; }
.nav .it.on .lb { color:var(--on); font-weight:600; }
.gest { height:22px; display:flex; align-items:center; justify-content:center; }
.gest b { width:108px; height:4px; border-radius:2px; background:#1B1B19; opacity:.85; }

.th { position:relative; height:80px; flex:none; }
.th.sub { height:96px; }
.th .tt { position:absolute; left:20px; bottom:13px; right:120px; }
.th h2 { font-size:30px; line-height:36px; font-weight:700; letter-spacing:-.6px; white-space:nowrap; }
.th .st { font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); margin-top:2px; }
.acts { position:absolute; right:8px; top:6px; display:flex; }
.acts i, .sbar .acts i { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--on); }
.sbar { height:64px; flex:none; display:flex; align-items:center; padding:0 8px 0 4px; gap:4px; position:relative; }
.sbar > i { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:24px; }
.sbar h3 { font-size:20px; line-height:26px; font-weight:600; letter-spacing:-.3px; white-space:nowrap; }
.sbar .st { font-size:13px; line-height:18px; color:var(--onVar); font-weight:500; }

.lbl { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
.lbl span { font-size:16px; line-height:22px; font-weight:700; letter-spacing:-.15px; }
.lbl em { font-style:normal; color:var(--primary); font-size:14px; font-weight:500; }
.panel { background:var(--cLow); border-radius:24px; padding:16px 18px; }
.hscroll { display:flex; gap:10px; padding:0 16px; overflow:hidden; }

.card { position:relative; flex:none; border-radius:18px; overflow:hidden; background:var(--cHigh); }
.card > img, .ph { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.card .scrim { position:absolute; left:0; right:0; bottom:0; height:62%; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62)); }
.card .tx { position:absolute; left:12px; right:10px; bottom:10px; color:#fff; }
.card .tx b { display:block; font-size:14px; line-height:20px; font-weight:600; letter-spacing:-.05px; overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.card .tx small { display:block; font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .disc { position:absolute; left:8px; top:8px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.card .disc i { font-size:16px; }

.chips { padding:2px 16px 6px; display:flex; flex-direction:column; gap:8px; }
.chips div { display:flex; gap:8px; }
.chip { height:32px; border-radius:16px; border:1px solid var(--outlineVar); display:inline-flex; align-items:center; gap:6px; padding:0 14px;
  font-size:14px; font-weight:500; color:var(--onVar); white-space:nowrap; background:var(--bg); }
.chip i { font-size:18px; }
.chip.dd { padding-right:8px; }
/* a piece of an app screen laid over the canvas, beside the phone (the burst strip, the lock, search, the map, a video) */
.callout { position:absolute; z-index:5; background:var(--bg); color:var(--on); font-family:var(--ui); border-radius:24px; padding:14px;
  box-shadow:0 30px 70px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:10px; }
.callout .hd { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
.callout .hd i { font-size:18px; color:var(--primary); }
.callout .hd small { margin-left:auto; font-size:12px; font-weight:500; color:var(--onVar); white-space:nowrap; }

.mh { font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.4px; padding:14px 16px 2px; }
.dh { height:42px; display:flex; align-items:center; padding:0 10px 0 16px; gap:8px; }
.dh b { font-size:14px; font-weight:600; flex:1; }
.dh small { font-size:12px; color:var(--onVar); font-weight:500; }
.dh i { font-size:22px; color:var(--outline); }
.grid { display:grid; gap:2px; }
.cell { position:relative; aspect-ratio:1; overflow:hidden; background:var(--cHigh); }
.cell img { width:100%; height:100%; object-fit:cover; display:block; }
.cell .cl { position:absolute; right:5px; bottom:5px; color:#fff; font-size:15px; filter:drop-shadow(0 0 2px rgba(0,0,0,.6)); }
.cell .vd { position:absolute; right:5px; top:5px; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; gap:1px;
  text-shadow:0 0 3px rgba(0,0,0,.7); }
.cell .vd i { font-size:14px; filter:drop-shadow(0 0 2px rgba(0,0,0,.6)); }

.meter { height:6px; border-radius:3px; background:var(--cHighest); overflow:hidden; }
.meter b { display:block; height:100%; border-radius:3px; background:var(--primary); }
.big .l { font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.big .v { font-size:40px; line-height:46px; font-weight:700; letter-spacing:-1px; }
.big .s { font-size:14px; line-height:20px; color:var(--onVar); }
.share { display:flex; gap:3px; height:8px; border-radius:4px; overflow:hidden; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; }
.legend span { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--onVar); }
.legend span b { color:var(--on); font-weight:500; }
.legend span i { width:8px; height:8px; border-radius:50%; display:block; }

/* swipe */
.deck { position:relative; flex:1; min-height:0; }
.mcard { position:absolute; inset:0; border-radius:24px; overflow:hidden; background:#000; }
.mcard img { width:100%; height:100%; object-fit:cover; display:block; }
.seal { position:absolute; top:28px; padding:4px; border-radius:10px; background:rgba(255,255,255,.92); border:2.5px solid; }
.seal span { display:block; border:1px solid; border-radius:7px; padding:2px 14px; font-size:26px; line-height:32px; font-weight:700; letter-spacing:2px; }
.meta { text-align:center; font-size:14px; line-height:20px; font-weight:500; color:var(--onVar); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dbar { display:flex; justify-content:center; align-items:flex-end; gap:18px; }
/* As in the app: keep is a swipe to the right, so its button stays on the right in Arabic too. */
.dbar { direction:ltr; }
.ra { display:flex; flex-direction:column; align-items:center; gap:6px; }
.ra .o { border-radius:50%; display:flex; align-items:center; justify-content:center; }
.ra small { font-size:13px; line-height:18px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.hint { text-align:center; font-size:12px; line-height:17px; color:var(--onVar); }
.pillw { display:inline-block; font-size:12px; line-height:16px; font-weight:500; letter-spacing:.2px; padding:3px 9px; border-radius:99px; white-space:nowrap; }

/* burst */
.strip { display:flex; gap:6px; padding:0 2px; }
.sth { position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; background:var(--cHigh); flex:none; }
.sth .ph { transform-origin:center; }
.sth.f::after { content:''; position:absolute; inset:0; border:2.5px solid var(--primary); border-radius:10px; }
.mb { position:absolute; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.mb i { font-size:13px; }
.qc { height:32px; border-radius:16px; border:1px solid var(--outlineVar); background:var(--cLow); display:inline-flex; align-items:center; gap:6px;
  padding:0 12px 0 10px; font-size:14px; font-weight:500; white-space:nowrap; }
.qc i { font-size:16px; color:var(--primary); }

/* cloud */
.stack { display:flex; flex-direction:column; gap:16px; padding:4px 16px 24px; }
.sec .lbl { padding:0 4px; }
.sw { display:flex; align-items:center; gap:14px; }
.sw .n { flex:1; }
.sw .n b { display:block; font-size:16px; line-height:24px; font-weight:400; }
.sw .n small { display:block; font-size:12px; line-height:17px; color:var(--onVar); }
.switch { width:52px; height:32px; border-radius:16px; background:var(--primary); position:relative; flex:none; }
.switch b { position:absolute; right:4px; top:4px; width:24px; height:24px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
.switch b i { font-size:16px; color:var(--primary); }
.rule { height:1px; background:var(--outlineVar); }
.okline { display:flex; gap:8px; align-items:center; font-size:14px; line-height:20px; color:var(--onVar); }
.okline i { font-size:20px; color:var(--primary); }

/* ═════════ feature graphic: the introduction in landscape — name and the four parts on the left, photos and the app on the right ═════════ */
#fg { width:1024px; height:500px; }
#fg .wall { position:absolute; left:300px; top:-120px; width:900px; display:flex; gap:14px; transform:rotate(-11deg); transform-origin:50% 0; }
#fg .wall .col { flex:1; display:flex; flex-direction:column; gap:14px; }
#fg .wall img { width:100%; border-radius:18px; object-fit:cover; display:block; }
/* Solid green under the words, the photos clear around the phone. */
#fg .fade { position:absolute; inset:0; background:linear-gradient(90deg, var(--primary) 0, var(--primary) 38%, rgba(35,107,70,.6) 50%,
  rgba(35,107,70,.1) 68%, rgba(35,107,70,0) 100%); }
#fg .left { position:absolute; z-index:3; left:56px; top:0; bottom:0; width:480px; display:flex; flex-direction:column; justify-content:center; gap:22px; }
#fg .brand { display:flex; align-items:center; gap:22px; direction:ltr; }
#fg .brand svg { width:96px; height:96px; border-radius:25px; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.18), 0 16px 40px rgba(0,0,0,.25); }
#fg .brand b { font-size:92px; line-height:1; font-weight:800; letter-spacing:-2.6px; }
#fg .left > small { font-size:30px; line-height:1.25; font-weight:600; white-space:nowrap; overflow:hidden; }
#fg .tags { display:flex; flex-wrap:wrap; gap:14px; zoom:.7; }
#fg .device { left:676px; top:54px; width:260px; padding:8px; border-radius:36px; z-index:2; }
#fg .device .glass { border-radius:29px; }
#fg .cam { width:10px; height:10px; top:10px; box-shadow:none; }

/* ═════════ the introduction (first screenshot): a wall of photos, the app in front, its four parts as tags ═════════ */
.intro .wall { position:absolute; left:-330px; top:250px; width:1800px; display:flex; gap:22px; transform:rotate(-11deg); transform-origin:50% 0; }
.intro .wall .col { flex:1; display:flex; flex-direction:column; gap:22px; }
.intro .wall img { width:100%; border-radius:30px; object-fit:cover; display:block; }
/* The wall rises out of the green: solid behind the name, clear around the phone. */
.intro .fade { position:absolute; inset:0; background:linear-gradient(180deg, var(--primary) 0, var(--primary) 27%, rgba(35,107,70,.5) 35%,
  rgba(35,107,70,.06) 48%, rgba(35,107,70,0) 100%); }
.intro .brand { position:absolute; left:60px; right:60px; top:84px; display:flex; flex-direction:column; align-items:center; text-align:center; }
/* The logo lockup reads icon-then-name in every language, Arabic too. */
.intro .brand .row { display:flex; align-items:center; gap:30px; direction:ltr; }
.intro .brand svg { width:150px; height:150px; border-radius:38px; box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 24px 60px rgba(0,0,0,.25); }
.intro .brand b { font-size:136px; line-height:1; font-weight:800; letter-spacing:-3.5px; }
.intro .brand small { font-size:46px; line-height:1.25; font-weight:600; color:#fff; margin-top:30px; white-space:nowrap; }
.intro .tags { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:30px; }
/* The four parts as tags, here and on the feature graphic. */
.tag { display:flex; align-items:center; gap:10px; height:62px; padding:0 24px 0 14px; border-radius:31px; white-space:nowrap;
  background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.22); font-size:28px; font-weight:600; }
.tag i { width:40px; height:40px; border-radius:50%; background:var(--inversePrimary); color:var(--onPrimaryC); font-size:24px;
  display:flex; align-items:center; justify-content:center; }
.intro .device { top:700px; z-index:2; }
/* Pieces of the library laid on the wall like prints: a memory and a place (and the feature graphic's memory). */
.print { position:absolute; z-index:3; background:#fff; padding:12px 12px 0; border-radius:26px; box-shadow:0 34px 70px rgba(0,0,0,.4); }
.print .card { border-radius:18px; }
.print .card .tx { left:22px; right:18px; bottom:20px; }
.print .card .tx b { font-size:38px; line-height:1.15; white-space:nowrap; }
.print .card .tx small { font-size:26px; line-height:1.3; margin-top:4px; }
.print .foot { height:66px; display:flex; align-items:center; gap:10px; padding:0 10px; color:var(--on); font-size:28px; font-weight:600; white-space:nowrap; }
.print .foot i { font-size:34px; color:var(--primary); }
.heart { position:absolute; z-index:4; width:92px; height:92px; border-radius:50%; background:#fff; color:#E0245E; font-size:52px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 16px 36px rgba(0,0,0,.3); }

/* ═════════ 2: cleanup — a smaller phone on the left, the kept photo flying out of it, what was found beside it ═════════ */
.clean .device { left:52px; width:608px; }
.fly { position:absolute; z-index:4; border-radius:40px; overflow:hidden; background:#000; border:10px solid #fff;
  box-shadow:0 44px 90px rgba(0,0,0,.42); }
.fly img { width:100%; height:100%; object-fit:cover; display:block; }
.fly .seal { zoom:1.7; }
.finds { position:absolute; z-index:3; right:34px; width:372px; display:flex; flex-direction:column; gap:16px; }
.find { display:flex; align-items:center; gap:18px; padding:18px 20px 18px 18px; border-radius:30px; background:var(--bg); color:var(--on);
  box-shadow:0 24px 50px rgba(0,0,0,.28); }
.find .dsc { width:64px; height:64px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
.find .dsc i { font-size:34px; }
.find > div { min-width:0; flex:1; }
.find b { display:block; font-size:25px; line-height:1.22; font-weight:600; }
.find em { display:block; font-style:normal; font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-.6px; color:var(--primary); white-space:nowrap; }
body.cjk .find b { word-break:keep-all; }

/* ═════════ 3: Private — the same layout on a dark ground ═════════ */
.shot.dark { background:radial-gradient(110% 70% at 50% 68%, #1E3B2C 0, #111613 62%, #0B0D0C 100%); }
.dark .cap p { color:#A9C3B3; }
.dark .device { box-shadow:0 40px 110px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.08), 0 0 160px rgba(143,203,166,.16); }

/* ═════════ 4: the library — Collections in the phone, search and the map beside it ═════════ */
.scs { display:flex; gap:10px; padding:4px 16px 0; }
.sc { flex:1; min-width:0; display:flex; align-items:center; gap:6px; padding:10px 6px 10px 8px; border-radius:16px; background:var(--cLow); }
.sc > div { min-width:0; }
.dsc { width:28px; height:28px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
.dsc i { font-size:16px; }
.sc b { display:block; font-size:14px; line-height:20px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sc small { display:block; font-size:12px; line-height:16px; font-weight:500; color:var(--onVar); }
.faces { display:flex; gap:12px; padding:0 16px; overflow:hidden; }
.face { width:84px; flex:none; display:flex; flex-direction:column; align-items:center; }
.face span { position:relative; width:72px; height:72px; border-radius:50%; overflow:hidden; display:block; background:var(--cHigh); }
.face img { position:absolute; display:block; max-width:none; }
.face b { font-size:14px; line-height:20px; font-weight:600; margin-top:6px; white-space:nowrap; }
.face small { font-size:12px; line-height:16px; font-weight:500; color:var(--onVar); }
.lbl em { display:flex; align-items:center; gap:6px; }
.lbl em i { font-size:18px; }
.atiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px; }
.atile { aspect-ratio:1; border-radius:16px; overflow:hidden; position:relative; background:var(--cLow); display:flex; align-items:center; justify-content:center; }
.sfield { height:48px; border-radius:24px; background:var(--cHigh); display:flex; align-items:center; gap:10px; padding:0 12px 0 14px; }
.sfield i { font-size:20px; color:var(--onVar); }
.sfield span { flex:1; font-size:16px; font-weight:500; white-space:nowrap; }
.sfield span::after { content:''; display:inline-block; width:2px; height:20px; background:var(--primary); vertical-align:-4px; margin-left:2px; }
.scount { font-size:13px; line-height:18px; font-weight:500; color:var(--onVar); padding:0 4px; }
.map { position:relative; width:250px; height:190px; border-radius:16px; overflow:hidden; }
.map svg { position:absolute; inset:0; }
.pin { position:absolute; transform:translate(-50%,-50%); min-width:34px; height:34px; padding:0 8px; border-radius:17px; background:var(--primary); color:#fff;
  border:3px solid var(--bg); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; box-shadow:0 3px 8px rgba(0,0,0,.25); }

/* ═════════ 5: backup — a video in the cloud beside the phone ═════════ */
.vthumb { position:relative; width:230px; height:300px; border-radius:16px; overflow:hidden; background:#000; }
.vthumb .play { position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:rgba(0,0,0,.45);
  color:#fff; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.vthumb .play i { font-size:40px; }
.vthumb .dur { position:absolute; right:10px; top:10px; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; gap:2px; text-shadow:0 0 4px rgba(0,0,0,.7); }
.vthumb .dur i { font-size:16px; }
.vthumb .cl { position:absolute; left:10px; bottom:10px; color:#fff; font-size:22px; filter:drop-shadow(0 0 3px rgba(0,0,0,.6)); }
.cmark { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--onVar); white-space:nowrap; }
.cmark i { font-size:18px; color:var(--primary); }
.hero { display:flex; align-items:center; gap:14px; }
.hero .n { flex:1; min-width:0; }
.hero b { display:block; font-size:20px; line-height:26px; font-weight:600; letter-spacing:-.3px; }
.hero small { display:block; font-size:14px; line-height:20px; color:var(--onVar); }

</style>
</head>
<body>
<div id="stage"></div>
<script src="store-images-app-strings.js"></script>
<script src="store-images-i18n.js"></script>
<script>
const CAP = window.STORE_I18N;

// ─────────────── language ───────────────
const L = new URLSearchParams(location.search).get('lang') || 'en';
// Folder codes (images/store/<lang>) → the locale for dates, plurals and numbers.
// Thai dates in the Gregorian years the app shows, not the Buddhist era a browser picks for th.
const LOC = { zh:'zh-CN', pt:'pt-BR', th:'th-TH-u-ca-gregory' }[L] || L;
const A = APP_STRINGS[L], EN = APP_STRINGS.en, C = CAP[L];
document.documentElement.lang = LOC;
const CJK = { ja:'Noto Sans JP', zh:'Noto Sans SC', 'zh-TW':'Noto Sans TC', ko:'Noto Sans KR' }[L];
if (CJK) {
  document.body.classList.add('cjk');
  document.documentElement.style.setProperty('--cjk', `'${CJK}'`);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${CJK.replace(/ /g, '+')}:wght@400;500;600;700;800&display=block`;
  document.head.appendChild(link);
}
// Scripts Geist does not draw: their Noto face, through the same fallback slot as CJK.
const SCRIPT = { hi:'Noto Sans Devanagari', th:'Noto Sans Thai', ar:'Noto Sans Arabic', bn:'Noto Sans Bengali' }[L];
if (SCRIPT) {
  document.body.classList.add('untracked');
  document.documentElement.style.setProperty('--cjk', `'${SCRIPT}'`);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${SCRIPT.replace(/ /g, '+')}:wght@400;500;600;700;800&display=block`;
  document.head.appendChild(link);
}
if (L === 'ar') document.body.classList.add('rtl');
const fmt = (s, a) => { let i = 0; return s.replace(/%(\d+)\$[ds]|%[ds]/g, (m, p) => String(p ? a[p - 1] : a[i++])); };
const t = (k, ...a) => fmt(A[k] ?? EN[k], a);
const pl = (k, n, ...a) => { const f = A[k] ?? EN[k]; return fmt(f[new Intl.PluralRules(LOC).select(n)] ?? f.other, [n, ...a]); };
// domain/ByteFormat.kt: decimal units, Locale.US, one decimal under 100.
const bytes = gb => { let v = gb * 1e9, u = -1; const U = ['KB','MB','GB','TB']; while (v >= 1000 && u < 3) { v /= 1000; u++; }
  const text = (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + U[u];
  // In Arabic a size is one left-to-right run, or "GB 38.2" comes out reversed.
  return L === 'ar' ? '⁦' + text + '⁩' : text; };
const D = (y, m, d, h = 12, mi = 0, s = 0) => new Date(y, m - 1, d, h, mi, s);
const TODAY = D(2026, 9, 28);
const df = (o, d) => new Intl.DateTimeFormat(LOC, o).format(d);
const monthTitle = (y, m) => df({ year:'numeric', month:'long' }, D(y, m, 1));
const dayTitle = d => { const diff = Math.round((TODAY - d) / 864e5);
  return diff === 0 ? t('day_today') : diff === 1 ? t('day_yesterday') : df({ weekday:'short', month:'short', day:'numeric' }, d); };
const P = n => `images/photos/${n}.jpg`;
// {vault} = the app's own name for the vault (lib_vault: Private / プライベート / Tresor …), so a rename in the app carries over.
// A size never splits from its unit across lines ("500 GB").
const fill = s => s.replace(/\{vault\}/g, t('lib_vault')).replace(/(\d) (GB|TB|Go|To|ГБ|ТБ)/g, '$1 $2');
const mi = (n, cls = 'mi', st = '') => `<i class="${cls}" style="${st}">${n}</i>`;

// ─────────────── the icon (res/drawable/ic_launcher_foreground.xml on @color/brand) ───────────────
const ICON_SVG = (vb = '0 0 108 108') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">
  <rect x="-20" y="-20" width="148" height="148" fill="#236B46"/>
  <path d="M27,45 Q31,44.5 35,42 L54,30 L73,42 Q77,44.5 81,45" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(8 56 60)"><path fill="#fff" fill-opacity=".5" d="M43.5,47 h25 a3.5,3.5 0 0 1 3.5,3.5 v19 a3.5,3.5 0 0 1 -3.5,3.5 h-25 a3.5,3.5 0 0 1 -3.5,-3.5 v-19 a3.5,3.5 0 0 1 3.5,-3.5 z"/></g>
  <path fill="#fff" d="M39.5,50 h29 a3.5,3.5 0 0 1 3.5,3.5 v21 a3.5,3.5 0 0 1 -3.5,3.5 h-29 a3.5,3.5 0 0 1 -3.5,-3.5 v-21 a3.5,3.5 0 0 1 3.5,-3.5 z"/>
  <path fill="#236B46" d="M40.5,74 L50.5,62.5 L56.5,69 L61,64.5 L67.5,74 z"/>
  <path fill="#236B46" d="M59.3,57 a3.2,3.2 0 1 0 6.4,0 a3.2,3.2 0 1 0 -6.4,0 z"/>
</svg>`;
// The roof alone, as a faint watermark behind the captions.
const ROOF = (w, st) => `<svg class="roof" style="${st}" width="${w}" viewBox="25 27 58 20"><path d="M27,45 Q31,44.5 35,42 L54,30 L73,42 Q77,44.5 81,45"
  fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ─────────────── shared app chrome ───────────────
const statusBar = () => `<div class="sb"><span>10:24</span><span class="ic">${mi('signal_cellular_alt')}${mi('wifi')}${mi('battery_full')}</span></div>`;
const navBar = on => {
  const items = [['photo', t('tab_library')], ['collections_bookmark', t('tab_collections')], ['cleaning_services', t('tab_sort')], ['settings', t('settings_title')]];
  return `<div class="nav"><div class="row">${items.map(([ic, lb], i) =>
    `<div class="it ${i === on ? 'on' : ''}"><div class="pill">${mi(ic, i === on ? 'mi' : 'mo')}</div><div class="lb">${lb}</div></div>`).join('')}</div>
    <div class="gest"><b></b></div></div>`;
};
const gestOnly = () => `<div class="gest"><b></b></div>`;
const tabHeader = (title, sub, acts) => `<div class="th ${sub ? 'sub' : ''}"><div class="tt"><h2>${title}</h2>${sub ? `<div class="st">${sub}</div>` : ''}</div>
  <div class="acts">${acts.map(a => mi(a, 'mo')).join('')}</div></div>`;
const screenBar = (title, sub, acts = []) => `<div class="sbar">${mi('arrow_back')}<div><h3>${title}</h3>${sub ? `<div class="st">${sub}</div>` : ''}</div>
  ${acts.length ? `<div class="acts" style="top:8px">${acts.map(a => mi(a, 'mo')).join('')}</div>` : ''}</div>`;
const label = (text, action) => `<div class="lbl"><span>${text}</span>${action ? `<em>${action}</em>` : ''}</div>`;
const photoCard = ({ src, title, detail, w, h, icon, tone, style = '' }) => `<div class="card" style="width:${w}px;height:${h}px">
  <img class="ph" src="${P(src)}" style="${style}"><div class="scrim"></div>
  ${icon ? `<div class="disc" style="background:var(--${tone}C);color:var(--on${tone[0].toUpperCase() + tone.slice(1)}C)">${mi(icon, 'mo')}</div>` : ''}
  <div class="tx"><b>${title}</b>${detail ? `<small>${detail}</small>` : ''}</div></div>`;
const meter = f => `<div class="meter"><b style="width:${f * 100}%"></b></div>`;
const roundAction = (icon, lb, size, bg, fg, border = '') => `<div class="ra"><div class="o" style="width:${size}px;height:${size}px;background:${bg};color:${fg};${border}">
  ${mi(icon, 'mi', `font-size:${size * .42}px`)}</div><small>${lb}</small></div>`;
const decisionBar = info => `<div class="dbar">
  ${roundAction('undo', t('undo'), 48, 'var(--cHigh)', 'var(--onVar)')}
  ${roundAction('close', t('swipe_trash'), 70, 'var(--bg)', 'var(--error)', 'border:1.5px solid rgba(179,38,30,.7);')}
  ${roundAction('check', t('swipe_keep'), 70, 'var(--primary)', '#fff')}
  ${info ? `<div style="width:40px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--onVar)">${mi('info', 'mo', 'font-size:20px')}</div>` : ''}</div>`;
const seal = (word, ink, side, tilt, st = '') => `<div class="seal" style="${side}:28px;border-color:${ink};color:${ink};transform:rotate(${tilt}deg);${st}">
  <span style="border-color:${ink}99">${word.toLocaleUpperCase(LOC)}</span></div>`;

// ─────────────── pieces of app screens laid beside the phone ───────────────
// The burst strip (tidy/BurstPicker.kt): one burst of the same dog, each frame a slightly different crop, the way a burst drifts.
function burstCallout() {
  const frames = ['transform:scale(1.14) translate(-3%,2%)', 'transform:scale(1.02)', 'transform:scale(1.1) translate(4%,-2%);filter:brightness(.9)',
    'transform:scale(1.08) translate(2%,3%);filter:blur(1.2px)'];
  const dec = [-1, 0, -1, -1]; // trashed / open
  return `<div class="hd">${mi('burst_mode', 'mo')}${t('session_similar')}</div>
    <div class="strip">${frames.map((f, i) => `<div class="sth ${i === 1 ? 'f' : ''}"><img class="ph" src="${P('p237')}" style="${f};${dec[i] < 0 ? 'opacity:.35' : ''}">
      ${dec[i] < 0 ? `<div class="mb" style="background:var(--error);color:#fff;left:22px;top:22px">${mi('close')}</div>` : ''}
      ${i === 1 ? `<div class="mb" style="background:var(--secondaryC);color:var(--onSecondaryC);left:3px;top:3px">${mi('auto_awesome')}</div>` : ''}</div>`).join('')}</div>
    <div><span class="qc">${mi('auto_awesome')}${t('burst_keep_best_rest')}</span></div>`;
}

// Search by a place name: the geocoder names places in the phone's language, so this finds them in every language.
function searchCallout() {
  const found = ['p512', 'p509', 'p565', 'p558', 'p13', 'p507'];
  return `<div class="sfield">${mi('search', 'mo')}<span>${C.cities[1]}</span>${mi('close')}</div>
    <div class="scount">${pl('search_count', 86, bytes(.412))}</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);width:240px;border-radius:12px;overflow:hidden">
      ${found.map(src => `<div class="cell"><img src="${P(src)}"></div>`).join('')}</div>`;
}

// The map (collections/MapScreen.kt): each place a disc with how many shots are there. The streets are drawn, not tiles.
function mapCallout() {
  const pins = [[64, 58, 241], [176, 112, 86], [206, 40, 12], [104, 150, 37]];
  return `<div class="hd">${mi('map', 'mo')}${t('places_title')}</div>
    <div class="map"><svg viewBox="0 0 250 190" width="250" height="190">
      <rect width="250" height="190" fill="#ECEBE3"/>
      <path d="M0 128 C40 118 70 140 112 132 C150 124 170 150 210 146 C230 144 242 150 250 152 V190 H0 Z" fill="#B7D2E2"/>
      <path d="M150 0 C146 30 160 54 154 80 C150 98 160 112 176 126" fill="none" stroke="#B7D2E2" stroke-width="12"/>
      <path d="M14 20 h52 v38 h-52 z M188 70 c20 -8 44 4 52 22 l-40 10 z" fill="#D2E5C6"/>
      <path d="M0 92 L250 64 M84 0 L104 190 M0 30 L150 46 M196 0 L226 190" stroke="#fff" stroke-width="6" fill="none"/>
      <path d="M0 92 L250 64 M84 0 L104 190" stroke="#F3DFA8" stroke-width="3" fill="none"/>
      <path d="M30 0 L44 120 M120 20 L250 30 M0 160 L120 100" stroke="#fff" stroke-width="3" fill="none"/>
    </svg>${pins.map(([x, y, n]) => `<span class="pin" style="left:${x}px;top:${y}px">${n}</span>`).join('')}</div>`;
}

// A video that is only in the cloud: it plays from there (viewer/Media.kt CloudVideo).
function videoCallout() {
  return `<div class="vthumb"><img class="ph" src="${P('p124')}"><span class="play">${mi('play_arrow')}</span>
      <span class="dur">${mi('videocam')}1:08</span><i class="mo cl">cloud</i></div>
    <div class="cmark">${mi('cloud', 'mo')}${t('cloud_only_mark')} · ${bytes(1.21)}</div>`;
}

// Backup going now (cloud/BackupState.kt BackupHero).
function backupHero() {
  return `<div class="hero"><span class="dsc" style="width:48px;height:48px;background:var(--primaryC);color:var(--onPrimaryC)">${mi('cloud_upload', 'mo', 'font-size:26px')}</span>
    <div class="n"><b>${t('backup_running_title')}</b><small>${t('progress_n_of_m', 412, 1204)}</small></div></div>${meter(412 / 1204)}`;
}

function privateCallout() {
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;max-width:210px;text-align:center;padding:12px 8px">
    ${mi('lock', 'mo', 'font-size:44px;color:var(--primary)')}
    <b style="font-size:18px;line-height:1.4">${t('vault_locked')}</b>
    <span class="qc">${t('vault_unlock')}</span></div>`;
}

// ─────────────── the library the screens show ───────────────
const POOL = ['p110','p1025','p164','p431','p509','p419','p13','p106','p292','p392','p124','p200','p49','p360','p237','p434','p525','p28','p429',
  'p517','p235','p369','p163','p77','p512','p152','p450','p199','p288','p401','p323','p493','p10','p169','p565','p437','p225','p507','p287','p102',
  'p516','p128','p436','p488','p558','p165','p215','p327','p400','p54','p519','p553','p381','p159','p433','p219'];
const DAYS = [ // [date, count, size in GB]
  [D(2026, 9, 28), 3, .0214], [D(2026, 9, 27), 6, .0561], [D(2026, 9, 25), 5, .1872], [D(2026, 9, 22), 8, .0724],
  [D(2026, 9, 19), 7, .0643], [D(2026, 9, 14), 9, .2391], [D(2026, 9, 12), 6, .0512],
];
const VIDEOS = { 4:'0:24', 13:'1:08', 27:'0:11' };
function libraryGrid(cols) {
  let k = 0, html = `<div class="mh">${monthTitle(2026, 9)}</div>`;
  DAYS.forEach(([d, n, gb], di) => {
    html += `<div class="dh"><b>${dayTitle(d)}</b><small>${bytes(gb)}</small>${mi('radio_button_unchecked', 'mo')}</div><div class="grid" style="grid-template-columns:repeat(${cols},1fr)">`;
    for (let i = 0; i < n; i++, k++) {
      const v = VIDEOS[k];
      html += `<div class="cell"><img src="${P(POOL[k % POOL.length])}">
        ${v ? `<span class="vd">${mi('play_arrow')}${v}</span>` : ''}${di > 0 ? `<i class="mi cl">cloud_done</i>` : ''}</div>`;
    }
    html += `</div>`;
  });
  return html;
}

// ─────────────── the screens ───────────────
const SCREENS = {
  photos: ({ cols }) => `${statusBar()}
    ${tabHeader(t('tab_library'), pl('stats_items', 12480), ['grid_view', 'search'])}
    <div class="body">
      <div class="chips">
        <div><span class="chip dd">${mi('date_range', 'mo')}${t('filter_date_range')}${mi('arrow_drop_down')}</span><span class="chip">${mi('favorite_border', 'mo')}${t('lib_favorites')}</span></div>
        <div><span class="chip">${t('kind_photo')}</span><span class="chip">${t('kind_video')}</span><span class="chip">${t('kind_screenshot')}</span></div>
      </div>
      ${label(t('memories_title'))}
      <div class="hscroll">
        ${photoCard({ src:'p49', title:t('session_today'), detail:`2025 · ${pl('stats_items', 23)}`, w:124, h:172 })}
        ${photoCard({ src:'p419', title:t('session_today'), detail:`2024 · ${pl('stats_items', 41)}`, w:124, h:172 })}
        ${photoCard({ src:'p512', title:t('session_today'), detail:`2023 · ${pl('stats_items', 9)}`, w:124, h:172 })}
        ${photoCard({ src:'p164', title:monthTitle(2024, 9), detail:pl('stats_items', 86), w:124, h:172 })}
        ${photoCard({ src:'p525', title:monthTitle(2023, 9), detail:pl('stats_items', 57), w:124, h:172 })}
        ${photoCard({ src:'p507', title:monthTitle(2022, 9), detail:pl('stats_items', 33), w:124, h:172 })}
        ${photoCard({ src:'p392', title:monthTitle(2021, 9), detail:pl('stats_items', 28), w:124, h:172 })}
        ${photoCard({ src:'p434', title:monthTitle(2020, 9), detail:pl('stats_items', 14), w:124, h:172 })}
      </div>
      ${libraryGrid(cols)}
    </div>${navBar(0)}`,

  // The photo before this one has just been kept and flies out of the phone (shot 2 draws it on the canvas).
  swipe: () => `${statusBar()}${screenBar(t('session_today'), t('swipe_progress', 4, 24))}
    <div style="padding:0 20px">${meter(4 / 24)}</div>
    <div class="body" style="display:flex;flex-direction:column;gap:12px;padding:12px 16px 16px">
      <div class="deck">
        <div class="mcard" style="transform:translateY(12px) scale(.95);left:10px;right:10px"><img src="${P('p431')}"></div>
        <div class="mcard" style="box-shadow:0 12px 34px rgba(0,0,0,.25)"><img src="${P('p509')}"></div>
      </div>
      <div class="meta">${t('kind_photo')} · ${bytes(.0042)} · ${df({ year:'numeric', month:'short', day:'numeric' }, D(2023, 9, 28))}</div>
      ${decisionBar(false)}
      <div class="hint">${t('swipe_hint')}</div>
    </div>${gestOnly()}`,

  // Collections (collections/CollectionsScreen.kt): the fixed places, people, places, then the albums.
  collections: () => {
    const tile = (icon, lb, n, accent) => `<div class="sc"><span class="dsc" style="background:var(--${accent ? 'primaryC' : 'secondaryC'});
      color:var(--on${accent ? 'PrimaryC' : 'SecondaryC'})">${mi(icon, 'mo')}</span><div><b>${lb}</b><small>${n}</small></div></div>`;
    // Each face cropped from its photo, as FaceThumbs does: [photo, name, count, face centre x, y (0-1), zoom].
    const people = [['p1027', 'Emma', 214, .52, .47, 1.7], ['p836', 'Sofia', 132, .33, .2, 3.6], ['p832', 'Aiko', 87, .58, .34, 3.4],
      ['p838', 'Lena', 64, .48, .33, 2.8], ['p64', 'Maya', 23, .55, .43, 2.6]];
    const face = (x, y, z) => `width:${72 * z}px;left:${36 - x * 72 * z}px;top:${36 - y * 72 * z}px`;
    const places = [['p419', C.cities[0], 241], ['p512', C.cities[1], 86], ['p436', C.cities[2], 57]];

// Captions shrink until they fit their box, so no language overflows.
function fit(box) {
  const h1 = box.querySelector('h1'), p = box.querySelector('p');
  let s1 = parseFloat(getComputedStyle(h1).fontSize), s2 = p ? parseFloat(getComputedStyle(p).fontSize) : 0;
  const used = () => [...box.children].reduce((a, c) => a + c.offsetHeight, 0) + parseFloat(getComputedStyle(box).rowGap) * (box.children.length - 1);
  const wide = () => h1.scrollWidth > box.clientWidth + 1 || (p && p.scrollWidth > box.clientWidth + 1);
  for (let n = 0; n < 40 && (used() > box.clientHeight || wide()); n++) {
    s1 *= .96; h1.style.fontSize = s1 + 'px';
    if (p) { s2 = Math.max(s2 * .975, 22); p.style.fontSize = s2 + 'px'; }
  }
}
// Tab labels shrink to 9sp to stay on one line (NavBar.kt); screen-bar titles likewise.
function shrink(el, min) {
  let s = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 0.5 && s > min) { s -= .5; el.style.fontSize = s + 'px'; }
}
window.READY = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await new Promise(r => setTimeout(r, 300));
  document.querySelectorAll('.nav .lb').forEach(el => shrink(el, 9));
  document.querySelectorAll('.th h2').forEach(el => { el.style.overflow = 'hidden'; shrink(el, 20); });
  document.querySelectorAll('.cap').forEach(fit);
  // Shortcut names share the largest size at which all of them fit (CollectionsScreen.kt ShortcutTiles).
  const names = [...document.querySelectorAll('.sc b')];
  for (let s = 14; names.some(b => b.scrollWidth > b.clientWidth) && s > 9; s -= .5) names.forEach(b => b.style.fontSize = s + 'px');
  // The feature graphic's tagline stays on one line and its tags on two rows, inside the green.
  const fgLine = document.querySelector('#fg .left > small');
  for (let s = 30; fgLine.scrollWidth > fgLine.clientWidth && s > 18; s -= .5) fgLine.style.fontSize = s + 'px';
  const fgTags = document.querySelector('#fg .tags');
  for (let s = 28; fgTags.offsetHeight > 140 && s > 18; s -= .5) fgTags.querySelectorAll('.tag').forEach(el => el.style.fontSize = s + 'px');
  // A print's place name stays on one line.
  document.querySelectorAll('.print .tx b').forEach(b => shrink(b, 24));
  // The tagline stays on one line, within the brand's width (as a flex item it grows to its text); the tags stay on two rows.
  const intro = document.querySelector('.intro .brand small');
  for (let s = 46; intro.offsetWidth > intro.parentElement.clientWidth && s > 28; s -= .5) intro.style.fontSize = s + 'px';
  const tags = document.querySelector('.intro .tags');
  for (let s = 28; tags.offsetHeight > 140 && s > 20; s -= .5) tags.querySelectorAll('.tag').forEach(el => el.style.fontSize = s + 'px');
  return true;
})();
