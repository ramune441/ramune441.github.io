      var LANG_NAMES = {"ja":"日本語","en":"English","zh":"简体中文","zh-TW":"繁體中文","ko":"한국어","es":"Español","fr":"Français","de":"Deutsch","pt":"Português","it":"Italiano","ru":"Русский","id":"Bahasa Indonesia","hi":"हिन्दी","tr":"Türkçe","vi":"Tiếng Việt","th":"ไทย","pl":"Polski","ar":"العربية","nl":"Nederlands","bn":"বাংলা"};
      var HTML_LANG = {"ja":"ja","en":"en","zh":"zh-Hans","zh-TW":"zh-TW","ko":"ko","es":"es","fr":"fr","de":"de","pt":"pt-BR","it":"it","ru":"ru","id":"id","hi":"hi","tr":"tr","vi":"vi","th":"th","pl":"pl","ar":"ar","nl":"nl","bn":"bn"};
      var SUPPORTED = Object.keys(LANG_NAMES);
      var LANG_KEY = 'ashiato_lang';
      function matchLocale(tag) {
        var t = String(tag || '').toLowerCase().replace(/_/g, '-');
        if (!t) return null;
        if (/^zh-(tw|hk|mo|hant)/.test(t)) return 'zh-TW';
        if (/^zh/.test(t)) return 'zh';
        var p = t.split('-')[0];
        return SUPPORTED.indexOf(p) !== -1 ? p : null;
      }
      function detectLocale() {
        var q = null, saved = null;
        try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
        try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
        var found = matchLocale(q) || matchLocale(saved);
        var nav = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; !found && i < nav.length; i++) found = matchLocale(nav[i]);
        return found || 'en';
      }
      function applyMessages(code, m) {
        document.documentElement.lang = HTML_LANG[code];
        document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
        document.title = m.contact_doc_title;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = m[el.getAttribute('data-i18n')]; });
        document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', m[el.getAttribute('data-i18n-ph')]); });
        document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', m[el.getAttribute('data-i18n-aria')]); });
        var sel = document.getElementById('lang-select');
        if (sel) sel.value = code;
      }
      function bindSelector(onChange) {
        document.getElementById('lang-select').addEventListener('change', function () {
          var code = this.value;
          try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
          try { var u = new URL(location.href); u.searchParams.set('lang', code); history.replaceState(null, '', u.href); } catch (e) {}
          onChange(code);
        });
      }

      var locale = detectLocale();
      var msgs = MESSAGES[locale];
      function apply(next) {
        locale = next;
        msgs = MESSAGES[locale];
        applyMessages(locale, msgs);
        document.querySelectorAll('[data-lp-link]').forEach(function (a) { a.href = LP_PATHS[locale]; });
        document.getElementById('foot-privacy').href = 'privacy-policy.html?lang=' + encodeURIComponent(locale);
      }
      bindSelector(function (next) { apply(next); });
      apply(locale);

      // 拡張機能が問い合わせリンクに付与する匿名診断
      // (v=バージョン, app=アプリキー, days=利用日数, visits=累計訪問数, runs=実行回数,
      //  ev=失敗の種別ごとの件数, evLast=最新の失敗からの経過分, evSpan=記録が覆う期間(分))
      (function () {
        var params = new URLSearchParams(location.search);
        var parts = [];
        ['v', 'days', 'visits', 'runs', 'ev', 'evLast', 'evSpan'].forEach(function (k) {
          var val = (params.get(k) || '').slice(0, 150);
          if (val) parts.push(k + '=' + val);
        });
        document.getElementById('f-diagnostics').value = parts.join(', ');
        // アプリキーは「使っているアプリ」の初期値にする（ユーザーは変更できる）
        var APP_OPTIONS = { pairs: 'Pairs', with: 'With', toukare: '東カレデート', tinder: 'Tinder', badoo: 'Badoo', okcupid: 'OkCupid', match: 'Match' };
        var appValue = APP_OPTIONS[(params.get('app') || '').toLowerCase()];
        if (appValue) document.getElementById('f-app').value = appValue;
      })();

      var form = document.getElementById('contact-form');
      var success = document.getElementById('success');
      var errorBox = document.getElementById('error-box');
      var btn = document.getElementById('submit-btn');
      var btnLabel = document.getElementById('submit-label');
      var fileInput = document.getElementById('f-file');
      var fileDrop = document.getElementById('file-drop');
      var fileName = document.getElementById('file-name');
      var fileClear = document.getElementById('file-clear');
      var fileError = document.getElementById('file-error');

      function syncFileUI() {
        var f = fileInput.files[0];
        var tooLarge = !!f && f.size > MAX_FILE_BYTES;
        fileError.hidden = !tooLarge;
        if (tooLarge) { fileInput.value = ''; f = null; }
        fileDrop.classList.toggle('has-file', !!f);
        fileName.textContent = f ? f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + 'MB)' : '';
        fileClear.hidden = !f;
      }
      fileInput.addEventListener('change', syncFileUI);
      fileClear.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        fileInput.value = '';
        syncFileUI();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.reportValidity()) return;
        errorBox.classList.remove('show');
        btn.disabled = true;
        btnLabel.textContent = msgs.contact_sending;

        var data = new FormData(form);
        data.set('language', locale);

        fetch(ENDPOINT, { method: 'POST', body: data })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (!json.success) throw new Error(json.message || 'submit failed');
            form.style.display = 'none';
            success.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          })
          .catch(function () {
            errorBox.classList.add('show');
            btn.disabled = false;
            btnLabel.textContent = msgs.contact_submit;
          });
      });
    })();
  </script>
