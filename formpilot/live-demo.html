<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>お問い合わせフォーム</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#f8fafc;color:#1e293b;font-family:'Yu Gothic','Meiryo',sans-serif}main{margin:24px auto;padding:32px 46px;max-width:1180px;background:white;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 12px 38px #0f172a0c}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:32px}header span{color:#64748b;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}label{display:flex;flex-direction:column;gap:8px;font-size:21px;font-weight:700}input,select,textarea{width:100%;padding:11px 15px;border:2px solid #cbd5e1;border-radius:9px;font:23px/1.4 'Yu Gothic','Meiryo',sans-serif;color:#1e293b;background:white}input,select{height:57px}textarea{resize:none;height:94px}.wide{grid-column:1/-1}footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:17px;color:#64748b}button{border:1px solid #a7f3d0;border-radius:9px;background:#ecfdf5;color:#047857;padding:12px 20px;font:700 18px 'Yu Gothic','Meiryo',sans-serif;cursor:pointer}input:focus,select:focus,textarea:focus{outline:3px solid #a7f3d0;border-color:#059669}</style></head>
<body><main><header><h1>お問い合わせフォーム</h1><span>入力サンプル</span></header><form autocomplete="off" onsubmit="event.preventDefault()"><div class="grid">
<label>姓<input name="lastName" autocomplete="family-name"></label><label>名<input name="firstName" autocomplete="given-name"></label>
<label>メールアドレス<input name="email" type="email" autocomplete="email"></label><label>電話番号<input name="phone" type="tel" placeholder="090-1234-5678" autocomplete="tel-national"></label>
<label>郵便番号<input name="postal" placeholder="100-0005" autocomplete="postal-code"></label><label>都道府県<select name="state" autocomplete="address-level1"><option value="">選択してください</option><option>東京都</option><option>神奈川県</option><option>大阪府</option></select></label>
<label>町名・番地<input name="addressLine1" autocomplete="address-line1"></label><label>お問い合わせ種別<select name="inquiry"><option value="">選択してください</option><option>製品について</option><option>資料請求</option><option>その他</option></select></label>
<label class="wide">お問い合わせ内容<textarea name="message" rows="2"></textarea></label></div><footer><span>入力後に内容を確認してください。</span><button type="button" id="reopen" onclick="location.reload()">フォームを開き直す</button></footer></form></main></body></html>
