<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>SendReady story stage</title>
<!-- Stage for build-story.mjs: every frame is drawn by draw(state) from story.mjs; nothing animates on its own. -->
<style>
:root{--blue:#0f77f2;--deep:#0b5ed6;--sky:#eaf3ff;--ink:#14163a;--sub:#3c4068;--sun:#ffc83d;--warn:#e8590c}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fbfbff;font-family:'Yu Gothic UI','Meiryo',sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;opacity:0}
/* hook: the blunt draft, typed, then the question */
#hook{background:radial-gradient(circle at 50% 35%,#fff,#eaf3ff 75%)}
#hook .draft{position:absolute;left:330px;top:170px;width:1260px;padding:40px 52px;border-radius:30px;background:#fff;border:3px solid #cfe0fb;box-shadow:0 30px 80px #0b5ed61f}
#hook .to{font-size:30px;color:var(--sub);margin-bottom:18px}
#hook .text{font-size:62px;font-weight:700;min-height:90px;white-space:nowrap}
#hook .caret{display:inline-block;width:5px;height:66px;background:var(--blue);vertical-align:-8px;margin-left:6px}
#hook .q{position:absolute;left:0;right:0;top:560px;text-align:center;font-weight:800;font-size:104px;line-height:1.3}
#hook .q div:last-child{color:var(--warn)}
/* brand */
#brand{background:linear-gradient(135deg,#eaf3ff,#fff 60%,#fff6d9)}
#brand .row{position:absolute;top:320px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:48px}
#brand .row img{width:220px;height:220px}
#brand .name{font-size:156px;font-weight:800;letter-spacing:-.01em}
#brand .name span{color:var(--blue)}
#brand .tagline{position:absolute;top:640px;left:0;right:0;text-align:center;font-size:70px;font-weight:700;color:var(--deep)}
/* demo */
#demo{background:linear-gradient(130deg,#eaf3ff,#fbfbff 55%,#fff8e3)}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#win{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 30px 90px #14163a2e;border:2px solid #d9e6fb}
#win .bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#f1f4fa;border-bottom:1px solid #e1e6f0}
#win .bar i{width:14px;height:14px;border-radius:50%;background:#d5dae6}
#win .addr{margin-left:18px;flex:0 0 520px;height:30px;border-radius:15px;background:#fff;border:1px solid #e1e6f0;font:16px/28px 'Segoe UI',sans-serif;color:#6e739b;padding:0 16px}
#win .shot{position:relative}
#win .shot img{position:absolute;inset:0;width:100%;height:100%;display:block}
#win .shot img+img{opacity:0}
#marks{position:absolute;inset:0;pointer-events:none}
.ripple{position:absolute;border-radius:50%;border:5px solid var(--sun);background:#ffc83d33;transform:translate(-50%,-50%)}
.pointer{position:absolute;width:34px;height:44px;filter:drop-shadow(2px 4px 4px #0005);transform-origin:0 0}
.glow{position:absolute;border-radius:14px;box-shadow:0 0 0 5px var(--blue),0 0 34px 10px #3d90f588;background:#0f77f214}
#caption{position:absolute;left:60px;top:34px;padding:20px 38px;border-radius:22px;background:#14163af0;color:#fff;font-size:52px;font-weight:800;box-shadow:0 14px 40px #14163a40;white-space:nowrap}
#caption b{color:var(--sun)}
#keys{position:absolute;right:70px;bottom:60px;display:flex;gap:16px}
.key{min-width:96px;height:96px;padding:0 26px;border-radius:20px;background:#fff;border:3px solid #cfd6e6;border-bottom-width:9px;display:grid;place-items:center;font:800 46px 'Segoe UI',sans-serif;color:var(--ink);box-shadow:0 12px 30px #14163a26}
.key.hot{border-color:var(--blue);color:var(--blue)}
/* more: the other features as four cards */
#more{background:linear-gradient(135deg,#eaf3ff,#fff 60%,#fff6d9)}
#more .title{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:84px;font-weight:800}
#more .cards{position:absolute;top:220px;left:90px;right:90px;display:flex;gap:40px}
#more .card{flex:1;height:760px;border-radius:30px;background:#fff;border:3px solid #d9e6fb;box-shadow:0 24px 60px #0b5ed61c;display:flex;flex-direction:column;overflow:hidden}
#more .art{flex:1;position:relative;overflow:hidden;background:#f3f7fd;display:grid;place-items:center}
#more .art img{position:absolute;left:50%;top:22px;width:88%;transform:translateX(-50%);border-radius:18px;box-shadow:0 12px 30px #14163a24}
#more .label{padding:24px 22px 28px;font-size:34px;font-weight:800;line-height:1.4;text-align:center;min-height:170px;display:grid;place-items:center;word-break:auto-phrase;line-break:strict}
#more .keys{direction:ltr;display:flex;gap:8px;align-items:center;justify-content:center;font:800 30px 'Segoe UI',sans-serif;color:var(--sub)}
#more .keys .key{min-width:0;height:72px;font-size:28px;padding:0 16px;border-radius:16px;border-bottom-width:7px}
#more .menu{margin:44px auto 0;width:280px;border-radius:14px;background:#fff;box-shadow:0 14px 40px #14163a30;padding:10px 0;font:30px 'Segoe UI',sans-serif}
#more .menu div{padding:12px 26px;color:#9aa0b4}
#more .menu .on{background:var(--sky);color:var(--deep);font-weight:700;display:flex;gap:14px;align-items:center}
#more .menu .on img{position:static;transform:none;box-shadow:none;border-radius:0;width:34px;height:34px;flex:none}
#more .langs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:22px 18px;font:700 23px 'Segoe UI','Yu Gothic UI','Malgun Gothic','Microsoft YaHei UI','Nirmala UI','Leelawadee UI',sans-serif}
#more .langs span{padding:6px 14px;border-radius:999px;background:#fff;border:2px solid #cfe0fb;color:var(--deep)}
/* cta */
#cta{background:linear-gradient(135deg,#eaf3ff,#fff 60%,#fff6d9)}
#cta .title{position:absolute;top:200px;left:0;right:0;text-align:center;font-size:100px;font-weight:800}
#cta .chips{position:absolute;top:420px;left:0;right:0;display:flex;justify-content:center;gap:28px}
#cta .chip{font-size:46px;font-weight:700;padding:16px 38px;border-radius:999px;background:#fff;border:3px solid #cfe0fb;color:var(--deep)}
#cta .chip::before{content:'✓ ';color:var(--blue)}
#cta .button{position:absolute;top:600px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:26px;padding:32px 62px;border-radius:28px;background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff;font-size:60px;font-weight:800;white-space:nowrap;box-shadow:0 22px 60px #0f77f255}
#cta .button img{width:84px;height:84px;background:#fff;border-radius:50%;padding:10px}
#cta .note{position:absolute;top:850px;left:0;right:0;text-align:center;font-size:38px;color:var(--sub)}
</style></head><body>
<section class="scene" id="hook"><div class="draft"><div class="to"></div><div><span class="text"></span><span class="caret"></span></div></div><div class="q"><div></div><div></div></div></section>
<section class="scene" id="brand"><div class="row"><img alt=""><div class="name">Send<span>Ready</span></div></div><div class="tagline"></div></section>
<section class="scene" id="demo"><div id="world"><div id="win"><div class="bar"><i></i><i></i><i></i><div class="addr"></div></div><div class="shot"><img alt=""><img alt=""></div></div><div id="marks"></div></div><div id="caption"></div><div id="keys"></div></section>
<section class="scene" id="more"><div class="title"></div><div class="cards">
<div class="card"><div class="art"><img id="m-history" alt=""></div><div class="label"></div></div>
<div class="card"><div class="art"><div><div class="keys"><span class="key">Alt</span>+<span class="key">Shift</span>+<span class="key">S</span></div><div class="menu"><div>…</div><div class="on"><img id="m-mark" alt=""><span id="m-menu"></span></div><div>…</div></div></div></div><div class="label"></div></div>
<div class="card"><div class="art"><img id="m-presets" alt=""></div><div class="label"></div></div>
<div class="card"><div class="art"><div class="langs"><span>日本語</span><span>English</span><span>Español</span><span>Français</span><span>Deutsch</span><span>Italiano</span><span>Nederlands</span><span>Polski</span><span>Português</span><span>Русский</span><span>Türkçe</span><span>简体中文</span><span>繁體中文</span><span>한국어</span><span>Tiếng Việt</span><span>ไทย</span><span>Indonesia</span><span>हिन्दी</span><span>বাংলা</span><span>العربية</span></div></div><div class="label"></div></div>
</div></section>
<section class="scene" id="cta"><div class="title"></div><div class="chips"></div><div class="button"><img alt=""><span class="label"></span></div><div class="note"></div></section>
<script>
const $=s=>document.querySelector(s);
const rise=(el,p,dy=40)=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;};
const POINTER='<svg class="pointer" viewBox="0 0 24 30"><path d="M2 2L2 23L8 18L13 28L17 26L12 16L21 15Z" fill="#fff" stroke="#14163a" stroke-width="2" stroke-linejoin="round"/></svg>';
// Long lines in some languages shrink to fit instead of running off the frame.
const fits=[['#more .title',1800],['#hook .text',1150],['#hook .q div',1800],['#brand .tagline',1800],['#caption',1780],['#cta .title',1800],['#cta .chips',1800],['#cta .button',1700],['#cta .note',1800]];
const base=new Map();
function fit(){for(const [selector,max] of fits)for(const el of document.querySelectorAll(selector)){
 if(!base.has(el))base.set(el,parseFloat(getComputedStyle(el).fontSize));
 let size=base.get(el);el.style.fontSize=size+'px';
 const range=document.createRange(),width=()=>{
  if(selector==='#cta .chips')return[...el.children].reduce((w,c)=>w+c.offsetWidth+28,0);
  if(selector==='#caption'||selector==='#cta .button')return el.offsetWidth;
  range.selectNodeContents(el);return range.getBoundingClientRect().width;
 };
 while(width()>max&&size>20){size-=2;el.style.fontSize=size+'px';if(selector==='#cta .chips')for(const c of el.children)c.style.fontSize=size+'px';}
}}
function setup({logo,win,lang,dir,font,stills}){
 if(stills){$('#m-history').src=stills.history;$('#m-presets').src=stills.presets;}$('#m-mark').src=logo;
 document.documentElement.lang=lang;document.documentElement.dir=dir;if(font)document.body.style.fontFamily=font;
 for(const img of document.querySelectorAll('#brand img,#cta img'))img.src=logo;
 Object.assign($('#win').style,{left:win.x+'px',top:(win.y-win.bar)+'px',width:win.w+'px'});
 $('#win .bar').style.height=win.bar+'px';Object.assign($('#win .shot').style,{width:win.w+'px',height:win.h+'px'});
}
const setImg=async(img,src)=>{if(img.getAttribute('src')!==src){img.src=src;await img.decode();}};
async function draw(s){
 for(const id of ['hook','brand','demo','more','cta'])$('#'+id).style.opacity=s.opacity[id]||0;
 if(s.hook){const h=s.hook;$('#hook .to').textContent=h.to;$('#hook .text').textContent=h.text;$('#hook .caret').style.opacity=h.caret?1:0;
  h.lines.forEach((l,i)=>{const el=$(`#hook .q div:nth-child(${i+1})`);el.textContent=l.text;rise(el,l.p,60);});}
 if(s.brand){$('#brand .tagline').textContent=s.brand.tagline;const row=$('#brand .row');row.style.opacity=s.brand.logo;row.style.transform=`scale(${.9+.1*s.brand.logo})`;rise($('#brand .tagline'),s.brand.line);}
 if(s.demo){
  const d=s.demo,c=d.camera;$('#world').style.transform=`translate(960px,560px) scale(${c.s}) translate(${-c.x}px,${-c.y}px)`;
  $('#win .addr').textContent=d.address;
  const [a,b]=document.querySelectorAll('#win .shot img');await setImg(a,d.frame);
  if(d.next){await setImg(b,d.next.frame);b.style.opacity=d.next.p;}else b.style.opacity=0;
  const cap=$('#caption');cap.textContent=d.caption.text;cap.style.opacity=d.caption.p;cap.style.transform=`translateX(${(1-d.caption.p)*-40}px)`;
  $('#marks').innerHTML=d.glows.map(g=>`<div class="glow" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;opacity:${g.o}"></div>`).join('')
   +d.ripples.map(r=>`<div class="ripple" style="left:${r.x}px;top:${r.y}px;width:${r.r*2}px;height:${r.r*2}px;opacity:${r.o}"></div>`).join('')
   +(d.pointer?POINTER.replace('class="pointer"',`class="pointer" style="left:${d.pointer.x}px;top:${d.pointer.y}px;transform:scale(${d.pointer.press})"`):'');
  $('#keys').innerHTML=d.keys.map(k=>`<div class="key${k.hot?' hot':''}" style="opacity:${k.p};transform:translateY(${(1-k.p)*24}px) scale(${k.hot?1.08:1})">${k.text}</div>`).join('');
 }
 if(s.more){const m=s.more;$('#more .title').textContent=m.title;rise($('#more .title'),m.titleP);$('#m-menu').textContent=m.menu;
  document.querySelectorAll('#more .card').forEach((el,i)=>{const c=m.cards[i];el.querySelector('.label').textContent=c.label;el.style.opacity=c.p;el.style.transform=`translateY(${(1-c.p)*60}px) scale(${.94+.06*c.p})`;});}
 if(s.cta){
  const c=s.cta;$('#cta .title').textContent=c.title;rise($('#cta .title'),c.titleP);
  $('#cta .chips').innerHTML=c.chips.map(x=>`<div class="chip" style="opacity:${x.p};transform:translateY(${(1-x.p)*30}px)">${x.text}</div>`).join('');
  $('#cta .label').textContent=c.button;const b=$('#cta .button');b.style.opacity=c.buttonP;b.style.transform=`translateX(-50%) scale(${.92+.08*c.buttonP})`;
  $('#cta .note').textContent=c.note;$('#cta .note').style.opacity=c.noteP;
 }
 fit();
}
</script></body></html>
