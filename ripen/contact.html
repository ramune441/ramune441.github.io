            <button type="button" class="file-clear" id="file-clear" hidden aria-label="Remove file">&times;</button>

        <p class="privacy-note" data-i18n="contact_privacy_note">送信された内容は、お問い合わせへの対応のみに使用します。</p>
      </form>
    </div>

        if (msgs[key] !== undefined) el.setAttribute('placeholder', msgs[key]);
      });
      // 戻り先は表示言語の LP、プライバシーポリシーも同じ言語で開く
      document.querySelectorAll('[data-lp-link]').forEach(function (a) { a.setAttribute('href', locale === 'ja' ? './' : locale + '/'); });
      document.getElementById('pp-link').setAttribute('href', 'privacy-policy.html?lang=' + locale);
      var langSelect = document.getElementById('langSelect');
      LANG_NAMES.forEach(function (l) { var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; langSelect.appendChild(o); });
      langSelect.value = locale;
      langSelect.addEventListener('change', function () {
        try { localStorage.setItem(LANG_KEY, this.value); } catch (e) {}
        var params = new URLSearchParams(location.search);
        params.set('lang', this.value);
        location.search = params.toString();
      });

      var form = document.getElementById('contact-form');
      var success = document.getElementById('success');
      var errorBox = document.getElementById('error-box');
      var btn = document.getElementById('submit-btn');
      var btnLabel = document.getElementById('submit-label');
      var fileInput = document.getElementById('f-file');
      var fileDrop = document.getElementById('file-drop');
      var fileName = document.getElementById('file-name');
      var fileClear = document.getElementById('file-clear');
      var fileError = document.getElementById('file-error');

      function syncFileUI() {
        var f = fileInput.files[0];
        var tooLarge = !!f && f.size > MAX_FILE_BYTES;
        fileError.hidden = !tooLarge;
        if (tooLarge) { fileInput.value = ''; f = null; }
        fileDrop.classList.toggle('has-file', !!f);
        fileName.textContent = f ? f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + 'MB)' : '';
        fileClear.hidden = !f;
      }
      fileInput.addEventListener('change', syncFileUI);
      fileClear.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        fileInput.value = '';
        syncFileUI();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.reportValidity()) return;
        errorBox.classList.remove('show');
        btn.disabled = true;
        btnLabel.textContent = msgs.contact_sending;

        var data = new FormData(form);
        data.set('language', locale);

        fetch(ENDPOINT, { method: 'POST', body: data })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (!json.success) throw new Error(json.message || 'submit failed');
            form.style.display = 'none';
            success.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          })
          .catch(function () {
            errorBox.classList.add('show');
            btn.disabled = false;
            btnLabel.textContent = msgs.contact_submit;
          });
      });
    })();
  </script>

</body>
</html>
