<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Ripen Icon 512</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; display:flex; gap:32px; flex-wrap:wrap; padding:32px; }
  .icon { width:512px; height:512px; display:block; }
  /* full-bleed (Play Store applies its own mask) */
</style>
</head>
<body>
  <!-- 512x512 Play Store icon: 夜の庭（night garden）。
       app の adaptive icon（ic_launcher_foreground / _background）と同じ造形：
       夜→土のグラデーション地に、茎＋双葉（新緑）＋熟す金の実（収穫ゴールド）の芽。 -->
  <svg id="icon" class="icon" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 夜（上）→土（下・緑がかった暗色） -->
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#0A0A0A"/>
        <stop offset="0.55" stop-color="#0C140E"/>
        <stop offset="1"   stop-color="#13271B"/>
      </linearGradient>
      <!-- 実の後光（収穫ゴールド） -->
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"   stop-color="#FFD60A" stop-opacity="0.55"/>
        <stop offset="0.5" stop-color="#FFD60A" stop-opacity="0.14"/>
        <stop offset="1"   stop-color="#FFD60A" stop-opacity="0"/>
      </radialGradient>
      <!-- 実のハイライト -->
      <radialGradient id="fruit" cx="0.38" cy="0.34" r="0.75">
        <stop offset="0"  stop-color="#FFE969"/>
        <stop offset="0.5" stop-color="#FFD60A"/>
        <stop offset="1"  stop-color="#F2BE00"/>
      </radialGradient>
      <!-- 葉のグラデーション -->
      <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#43D86A"/>
        <stop offset="1" stop-color="#2BAE4C"/>
      </linearGradient>
      <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
        <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
        <stop offset="1"   stop-color="#000" stop-opacity="0.28"/>
      </radialGradient>
    </defs>

    <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

    <!-- 星（夜空） -->
    <g fill="#FFFFFF">
      <circle cx="18" cy="20" r="0.9" opacity="0.45"/>
      <circle cx="30" cy="13" r="0.6" opacity="0.30"/>
      <circle cx="86" cy="17" r="1.0" opacity="0.40"/>
      <circle cx="92" cy="30" r="0.6" opacity="0.28"/>
      <circle cx="74" cy="10" r="0.7" opacity="0.30"/>
      <circle cx="14" cy="40" r="0.6" opacity="0.22"/>
    </g>

    <!-- 土の盛り上がり -->
    <path d="M-4,96 C24,86 84,86 112,96 L112,112 L-4,112 Z" fill="#16311F"/>
    <path d="M-4,99 C24,90 84,90 112,99 L112,112 L-4,112 Z" fill="#0E2014" opacity="0.7"/>

    <!-- 芽（中央セーフゾーンの造形を拡大） -->
    <g transform="translate(54,55) scale(1.52) translate(-54,-54)">
      <!-- 実の後光 -->
      <circle cx="54" cy="38" r="22" fill="url(#glow)"/>
      <!-- 茎 -->
      <path d="M54,82 C54,71 54,60 54,49"
            fill="none" stroke="#2E9E4F" stroke-width="6" stroke-linecap="round"/>
      <!-- 左の葉 -->
      <path d="M52,62 C40,60 30,52 29,42 C40,44 49,51 52,62 Z" fill="url(#leaf)"/>
      <!-- 右の葉 -->
      <path d="M56,62 C68,60 78,52 79,42 C68,44 59,51 56,62 Z" fill="url(#leaf)"/>
      <!-- 葉脈 -->
      <path d="M50,60 C44,57 38,52 33,45" fill="none" stroke="#1E7E3A" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
      <path d="M58,60 C64,57 70,52 75,45" fill="none" stroke="#1E7E3A" stroke-width="1.1" opacity="0.55" stroke-linecap="round"/>
      <!-- 熟す実 -->
      <circle cx="54" cy="38" r="8.5" fill="url(#fruit)"/>
      <circle cx="51" cy="35" r="2.4" fill="#FFF4C2" opacity="0.85"/>
    </g>

    <rect x="0" y="0" width="108" height="108" fill="url(#vig)"/>
  </svg>
</body>
</html>
