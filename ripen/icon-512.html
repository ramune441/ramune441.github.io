<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Ripen Icon 512</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; display:flex; gap:32px; flex-wrap:wrap; padding:32px; }
  .icon { width:512px; height:512px; display:block; }
  /* full-bleed (Play Store applies its own mask) */
</style>
</head>
<body>
  <!-- 512x512 Play Store icon: 白背景（ライトモード基準）。
       app の adaptive icon（ic_launcher_foreground）と同じ造形：
       伸びる枝＋花（桜ピンクの五弁）＋熟した実（金→橙）＋葉＋舞う花びら。 -->
  <svg id="icon" class="icon" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 実（金→橙のラジアルグラデ・userSpace座標は前景アートに一致） -->
      <radialGradient id="fruit" gradientUnits="userSpaceOnUse" cx="66.5" cy="56.5" r="21.7">
        <stop offset="0" stop-color="#FFD60A"/>
        <stop offset="1" stop-color="#FF9F0A"/>
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#13241A" flood-opacity="0.18"/>
      </filter>
    </defs>

    <rect x="0" y="0" width="108" height="108" fill="#FFFFFF"/>

    <!-- 前景アート（ic_launcher_foreground と同一パス）を中央に拡大配置 -->
    <g filter="url(#soft)" transform="translate(54,54) scale(1.32) translate(-57.5,-52.9)">
      <!-- 枝 -->
      <path d="M40,84 C43,70 46,56 56.5,41.5" fill="none" stroke="#2E9E4F" stroke-width="6" stroke-linecap="round"/>
      <!-- 左下の葉 -->
      <path d="M44,72.5 C45.3,69.25 38.36,64.86 29,66.5 C34.64,74.14 42.7,75.75 44,72.5 Z" fill="#34C759"/>
      <!-- 実の柄（枝→実） -->
      <path d="M49,57 C56,53 63,49 69.5,49.5" fill="none" stroke="#2E9E4F" stroke-width="4" stroke-linecap="round"/>
      <!-- 実のヘタ葉 -->
      <path d="M70,48.5 C71.63,50.95 76.83,48.99 79,42.5 C72.17,42.01 68.37,46.05 70,48.5 Z" fill="#34C759"/>
      <!-- 熟した実 -->
      <circle cx="70.5" cy="61.5" r="14" fill="url(#fruit)"/>
      <!-- 実のハイライト -->
      <path d="M63.3,56.3 C61.9,59.3 62.3,63.1 64.3,65.5 C61.1,63.5 60.3,58.7 63.3,56.3 Z" fill="rgba(255,255,255,0.55)"/>
      <!-- 花（五弁・桜ピンク） -->
      <path d="M56.5,33 C51.1,30.25 52.61,21.78 56.5,22 C60.39,21.78 61.9,30.25 56.5,33 Z" fill="#F9C9D8"/>
      <path d="M58.88,34.73 C59.82,28.74 68.35,27.56 69.34,31.33 C70.75,34.96 63.16,39.01 58.88,34.73 Z" fill="#F9C9D8"/>
      <path d="M57.97,37.52 C63.95,36.57 67.71,44.31 64.44,46.42 C61.42,48.89 55.22,42.92 57.97,37.52 Z" fill="#F9C9D8"/>
      <path d="M55.03,37.52 C57.78,42.92 51.58,48.89 48.56,46.42 C45.29,44.31 49.05,36.57 55.03,37.52 Z" fill="#F9C9D8"/>
      <path d="M54.12,34.73 C49.84,39.01 42.25,34.96 43.66,31.33 C44.65,27.56 53.18,28.74 54.12,34.73 Z" fill="#F9C9D8"/>
      <!-- 花芯（金） -->
      <circle cx="56.5" cy="35.5" r="4" fill="#FFD60A"/>
      <!-- 舞う花びら（右上） -->
      <path d="M80,33.5 C83.02,31.16 87.51,34.3 86.34,36.46 C85.44,38.74 80.15,37.32 80,33.5 Z" fill="#F2A9C0"/>
    </g>
  </svg>
</body>
</html>
